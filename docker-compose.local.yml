services:
  backend:
    ports:
      - "8010:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${LOCAL_API_URL:-http://localhost:8010/api}
    ports:
      - "3010:3000"

  local-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.local
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5434:5432"

  redis:
    ports:
      - "6380:6379"

  litellm:
    ports:
      - "4000:4000"

  litellm-postgres:
    ports:
      - "5435:5432"

  vectordb:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vectordb
      POSTGRES_PASSWORD: vectordb
      POSTGRES_DB: vectordb
    ports:
      - "5433:5432"
    volumes:
      - vectordb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectordb -d vectordb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vectordb_data:
