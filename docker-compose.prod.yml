# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Removes dev ports, adds restart policies, tightens resources, no hot reload

services:
  # Init service: runs migrations once, exits when complete.
  # Backend depends on migrator health, ensuring migrations run before app starts.
  migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:-${DATABASE_URL}}
    command: alembic upgrade head
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      # API workers must NOT run the scheduler — the dedicated `scheduler`
      # service below owns it. Otherwise each of the 4 workers fires every cron
      # job, causing duplicate invoices/emails.
      DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL}}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      TOKEN_ENCRYPTION_KEYS: ${TOKEN_ENCRYPTION_KEYS:-}
      WORKSPACE_MCP_ENABLED: ${WORKSPACE_MCP_ENABLED:-false}
      WORKSPACE_MCP_RESOURCE: ${WORKSPACE_MCP_RESOURCE:-}
      WORKSPACE_MCP_CANONICAL_RESOURCE: ${WORKSPACE_MCP_CANONICAL_RESOURCE:-}
      WORKSPACE_MCP_RESOURCE_ALIASES: ${WORKSPACE_MCP_RESOURCE_ALIASES:-}
      RESEARCH_MCP_PUBLIC_URL: ${RESEARCH_MCP_PUBLIC_URL:-}
      RESEARCH_MCP_OAUTH_ENABLED: ${RESEARCH_MCP_OAUTH_ENABLED:-true}
      RESEARCH_MCP_AUDIENCE: ${RESEARCH_MCP_AUDIENCE:-lawhand-research-mcp}
      RESEARCH_MCP_ISSUER: ${RESEARCH_MCP_ISSUER:-}
      RESEARCH_MCP_ACCESS_TOKEN_MAX_MINUTES: ${RESEARCH_MCP_ACCESS_TOKEN_MAX_MINUTES:-15}
      RESEARCH_MCP_AUTH_CODE_TTL_SECONDS: ${RESEARCH_MCP_AUTH_CODE_TTL_SECONDS:-300}
      RESEARCH_MCP_REFRESH_TOKEN_DAYS: ${RESEARCH_MCP_REFRESH_TOKEN_DAYS:-30}
      RESEARCH_MCP_GRANT_DAYS: ${RESEARCH_MCP_GRANT_DAYS:-90}
      RESEARCH_MCP_CLIENT_REGISTRATION_DAYS: ${RESEARCH_MCP_CLIENT_REGISTRATION_DAYS:-30}
      RESEARCH_MCP_DYNAMIC_REGISTRATION_ENABLED: ${RESEARCH_MCP_DYNAMIC_REGISTRATION_ENABLED:-true}
      WORKSPACE_MCP_AUDIENCE: ${WORKSPACE_MCP_AUDIENCE:-lawhand-workspace-mcp}
      WORKSPACE_MCP_ISSUER: ${WORKSPACE_MCP_ISSUER:-}
      WORKSPACE_MCP_TOKEN_SIGNING_KEY: ${WORKSPACE_MCP_TOKEN_SIGNING_KEY:-}
      WORKSPACE_MCP_SIGNING_PRIVATE_KEY_B64: ${WORKSPACE_MCP_SIGNING_PRIVATE_KEY_B64:-}
      WORKSPACE_MCP_SIGNING_PUBLIC_KEY_B64: ${WORKSPACE_MCP_SIGNING_PUBLIC_KEY_B64:-}
      WORKSPACE_MCP_SIGNING_KEY_ID: ${WORKSPACE_MCP_SIGNING_KEY_ID:-}
      WORKSPACE_MCP_PREVIOUS_PUBLIC_KEYS_JSON: ${WORKSPACE_MCP_PREVIOUS_PUBLIC_KEYS_JSON:-[]}
      WORKSPACE_MCP_ACCESS_TOKEN_MAX_MINUTES: ${WORKSPACE_MCP_ACCESS_TOKEN_MAX_MINUTES:-15}
      WORKSPACE_MCP_AUTH_CODE_TTL_SECONDS: ${WORKSPACE_MCP_AUTH_CODE_TTL_SECONDS:-300}
      WORKSPACE_MCP_REFRESH_TOKEN_DAYS: ${WORKSPACE_MCP_REFRESH_TOKEN_DAYS:-30}
      WORKSPACE_MCP_GRANT_DAYS: ${WORKSPACE_MCP_GRANT_DAYS:-90}
      WORKSPACE_MCP_CLIENT_REGISTRATION_DAYS: ${WORKSPACE_MCP_CLIENT_REGISTRATION_DAYS:-30}
      WORKSPACE_MCP_DYNAMIC_REGISTRATION_ENABLED: ${WORKSPACE_MCP_DYNAMIC_REGISTRATION_ENABLED:-false}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      MCP_UPSTREAM_API_KEY: ${MCP_UPSTREAM_API_KEY:-}
      MCP_PRODUCT_ENABLED: ${MCP_PRODUCT_ENABLED:-false}
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      # Production invariant: override stale SMB_ENABLED=false from env_file.
      SMB_ENABLED: "true"
      EMAIL_ENABLED: ${EMAIL_ENABLED:?Set EMAIL_ENABLED in .env}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
      HOST_DISK_STATUS_FILE: /run/legalapp-host-status/disk-status.json
      HEALTH_HOST_DISK_MAX_AGE_SECONDS: ${HEALTH_HOST_DISK_MAX_AGE_SECONDS:-180}
      BACKUP_STATUS_FILE: ${BACKUP_STATUS_FILE:-}
      HEALTH_BACKUP_MAX_AGE_SECONDS: ${HEALTH_BACKUP_MAX_AGE_SECONDS:-7200}
      RUN_SCHEDULER: "false"
    volumes:
      - ${UPLOADS_HOST_DIR:?Set an absolute UPLOADS_HOST_DIR in .env}:/app/uploads
      - ${HOST_STATUS_HOST_DIR:?Set an absolute HOST_STATUS_HOST_DIR in .env}:/run/legalapp-host-status:ro
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers ${BACKEND_WORKERS:-4} --log-level info
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  # Dedicated single-process scheduler — the ONLY process with RUN_SCHEDULER=true,
  # so every cron job fires exactly once. Runs the same image/app with one worker
  # and is not placed behind nginx (it serves no user traffic). Job-level Postgres
  # advisory locks remain as a backstop against any accidental second runner.
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL}}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      TOKEN_ENCRYPTION_KEYS: ${TOKEN_ENCRYPTION_KEYS:-}
      WORKSPACE_MCP_ENABLED: ${WORKSPACE_MCP_ENABLED:-false}
      WORKSPACE_MCP_RESOURCE: ${WORKSPACE_MCP_RESOURCE:-}
      WORKSPACE_MCP_CANONICAL_RESOURCE: ${WORKSPACE_MCP_CANONICAL_RESOURCE:-}
      WORKSPACE_MCP_RESOURCE_ALIASES: ${WORKSPACE_MCP_RESOURCE_ALIASES:-}
      RESEARCH_MCP_PUBLIC_URL: ${RESEARCH_MCP_PUBLIC_URL:-}
      RESEARCH_MCP_OAUTH_ENABLED: ${RESEARCH_MCP_OAUTH_ENABLED:-true}
      RESEARCH_MCP_AUDIENCE: ${RESEARCH_MCP_AUDIENCE:-lawhand-research-mcp}
      RESEARCH_MCP_ISSUER: ${RESEARCH_MCP_ISSUER:-}
      RESEARCH_MCP_ACCESS_TOKEN_MAX_MINUTES: ${RESEARCH_MCP_ACCESS_TOKEN_MAX_MINUTES:-15}
      RESEARCH_MCP_AUTH_CODE_TTL_SECONDS: ${RESEARCH_MCP_AUTH_CODE_TTL_SECONDS:-300}
      RESEARCH_MCP_REFRESH_TOKEN_DAYS: ${RESEARCH_MCP_REFRESH_TOKEN_DAYS:-30}
      RESEARCH_MCP_GRANT_DAYS: ${RESEARCH_MCP_GRANT_DAYS:-90}
      RESEARCH_MCP_CLIENT_REGISTRATION_DAYS: ${RESEARCH_MCP_CLIENT_REGISTRATION_DAYS:-30}
      RESEARCH_MCP_DYNAMIC_REGISTRATION_ENABLED: ${RESEARCH_MCP_DYNAMIC_REGISTRATION_ENABLED:-true}
      WORKSPACE_MCP_AUDIENCE: ${WORKSPACE_MCP_AUDIENCE:-lawhand-workspace-mcp}
      WORKSPACE_MCP_ISSUER: ${WORKSPACE_MCP_ISSUER:-}
      WORKSPACE_MCP_TOKEN_SIGNING_KEY: ${WORKSPACE_MCP_TOKEN_SIGNING_KEY:-}
      WORKSPACE_MCP_SIGNING_PRIVATE_KEY_B64: ${WORKSPACE_MCP_SIGNING_PRIVATE_KEY_B64:-}
      WORKSPACE_MCP_SIGNING_PUBLIC_KEY_B64: ${WORKSPACE_MCP_SIGNING_PUBLIC_KEY_B64:-}
      WORKSPACE_MCP_SIGNING_KEY_ID: ${WORKSPACE_MCP_SIGNING_KEY_ID:-}
      WORKSPACE_MCP_PREVIOUS_PUBLIC_KEYS_JSON: ${WORKSPACE_MCP_PREVIOUS_PUBLIC_KEYS_JSON:-[]}
      WORKSPACE_MCP_ACCESS_TOKEN_MAX_MINUTES: ${WORKSPACE_MCP_ACCESS_TOKEN_MAX_MINUTES:-15}
      WORKSPACE_MCP_AUTH_CODE_TTL_SECONDS: ${WORKSPACE_MCP_AUTH_CODE_TTL_SECONDS:-300}
      WORKSPACE_MCP_REFRESH_TOKEN_DAYS: ${WORKSPACE_MCP_REFRESH_TOKEN_DAYS:-30}
      WORKSPACE_MCP_GRANT_DAYS: ${WORKSPACE_MCP_GRANT_DAYS:-90}
      WORKSPACE_MCP_CLIENT_REGISTRATION_DAYS: ${WORKSPACE_MCP_CLIENT_REGISTRATION_DAYS:-30}
      WORKSPACE_MCP_DYNAMIC_REGISTRATION_ENABLED: ${WORKSPACE_MCP_DYNAMIC_REGISTRATION_ENABLED:-false}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      MCP_UPSTREAM_API_KEY: ${MCP_UPSTREAM_API_KEY:-}
      MCP_PRODUCT_ENABLED: ${MCP_PRODUCT_ENABLED:-false}
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      # Keep scheduler retrieval policy identical to the API process.
      SMB_ENABLED: "true"
      EMAIL_ENABLED: ${EMAIL_ENABLED:?Set EMAIL_ENABLED in .env}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
      RUN_SCHEDULER: "true"
    volumes:
      - ${UPLOADS_HOST_DIR:?Set an absolute UPLOADS_HOST_DIR in .env}:/app/uploads
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 1 --log-level info
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  litellm:
    restart: unless-stopped
    environment:
      LITELLM_API_KEY: ${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set the permanent LITELLM_SALT_KEY in .env}
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL}
      STORE_MODEL_IN_DB: "True"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  litellm-postgres:
    restart: unless-stopped
    ports: []
    environment:
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - /data/legalapp/litellm-postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:?Set VITE_PUBLIC_SITE_URL to https://DOMAIN in .env}
        VITE_CONTACT_URL: ${VITE_CONTACT_URL:?Set VITE_CONTACT_URL in .env}
        VITE_PUBLIC_SIGNUP_ENABLED: ${VITE_PUBLIC_SIGNUP_ENABLED:-false}
        VITE_ENABLE_AFTER_CALL_ASSISTANT: ${VITE_ENABLE_AFTER_CALL_ASSISTANT:-false}
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    restart: unless-stopped
    ports: []    # no external exposure in prod
    # Defaults assume a tiny box: shared_buffers ships at 128MB regardless of the
    # 8G limit below, so the database would cache ~2% of the RAM reserved for it
    # and plan as if it had 4MB to sort in. These values are sized for the limit.
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    environment:
      POSTGRES_USER: legalapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: legalapp
      CLARITY_APP_PASSWORD: ${CLARITY_APP_PASSWORD:?Set CLARITY_APP_PASSWORD in .env}
    volumes:
      - /data/legalapp/postgres:/var/lib/postgresql/data
      - ./scripts/init_clarity_app_role.sh:/docker-entrypoint-initdb.d/10-clarity-app-role.sh:ro
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'

  redis:
    restart: unless-stopped
    ports: []    # no external exposure in prod
    # maxmemory stays below the container limit so Redis reports pressure
    # instead of being OOM-killed by the kernel.
    #
    # noeviction is deliberate. This instance holds refresh-token replay
    # tombstones and the revoked-jti denylist alongside ordinary cache, and
    # every key here is written with a TTL -- so volatile-lru would be no safer
    # than allkeys-lru and would silently drop revocation state under pressure,
    # re-enabling replay of a token that was already burned. Refusing writes is
    # the fail-closed answer: new sessions error loudly, revocation holds.
    #
    # Watch `used_memory` against maxmemory; if it trends up, split the RAG
    # cache onto its own instance rather than switching this one to an eviction
    # policy.
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --appendonly yes
      --maxmemory 384mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro           # cert files (written by renew-cert.sh)
      - ./nginx/webroot:/var/www/certbot:ro     # ACME challenge files (written by certbot)
    ports:
      - "80:80"
      - "443:443"
