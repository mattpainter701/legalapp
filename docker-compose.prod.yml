# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Removes dev ports, adds restart policies, tightens resources, no hot reload

services:
  # Init service: runs migrations once, exits when complete.
  # Backend depends on migrator health, ensuring migrations run before app starts.
  migrator:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    command: alembic upgrade head
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    volumes:
      - /data/legalapp/uploads:/app/uploads   # host-mounted encrypted volume
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 4 --log-level info
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  litellm:
    restart: unless-stopped
    environment:
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  litellm-postgres:
    restart: unless-stopped
    ports: []
    environment:
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - /data/legalapp/litellm-postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  frontend:
    restart: unless-stopped
    volumes:
      - frontend_dist:/app/dist
    environment:
      - VITE_API_URL=/api
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    restart: unless-stopped
    ports: []    # no external exposure in prod
    volumes:
      - /data/legalapp/postgres:/var/lib/postgresql/data   # host-mounted encrypted volume
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/pg_password
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'

  redis:
    restart: unless-stopped
    ports: []    # no external exposure in prod
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --appendonly yes
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro           # cert files (written by renew-cert.sh)
      - ./nginx/webroot:/var/www/certbot:ro     # ACME challenge files (written by certbot)
      - frontend_dist:/usr/share/nginx/html/dist:ro   # frontend static assets
