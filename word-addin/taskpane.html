<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LawHand</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header -->
  <div id="header">
    <div id="header-logo">
      <img src="assets/icon-32.png" width="18" height="18" alt="" aria-hidden="true" />
    </div>
    <span id="header-title">LawHand</span>
    <button id="btn-logout" class="btn-link hidden">Sign out</button>
  </div>

  <!-- Login Section -->
  <div id="login-section">
    <div id="login-card">
      <p id="login-subtitle">Source-aware legal work in Microsoft Word</p>

      <button id="btn-ms-login" class="btn-ms">
        <svg width="16" height="16" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        Sign in with Microsoft
      </button>

      <button id="btn-google-login" class="btn-google">
        <svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <p id="login-footer">Secure. Private. Accurate.</p>
    </div>
  </div>

  <!-- Chat Section (hidden until logged in) -->
  <div id="chat-section" class="hidden">

    <!-- Conversation title -->
    <div id="conv-header">
      <span id="conv-title">New Conversation</span>
      <button id="btn-new-conv" class="btn-icon" title="New conversation">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div id="messages-list">
      <div id="messages-empty">
        <p>Ask a legal question or use "Get Selected Text" to analyze document text.</p>
      </div>
    </div>

    <!-- Insert at cursor button (shown after AI response) -->
    <div id="insert-btn-wrapper" class="hidden">
      <button id="btn-insert-draft" class="btn-secondary">
        Insert Draft at Cursor
      </button>
    </div>

    <!-- Selected text button -->
    <div id="selection-wrapper">
      <button id="btn-get-selection" class="btn-secondary">
        Get Selected Text
      </button>
    </div>

    <!-- Input area -->
    <div id="input-area">
      <textarea
        id="chat-input"
        placeholder="Ask a legal question..."
        rows="3"
      ></textarea>
      <button id="btn-send" class="btn-primary">
        Send
      </button>
    </div>
  </div>

  <!-- Documents Section -->
  <div id="docs-section" class="hidden">
    <div id="docs-header">
      <span>Documents</span>
      <button id="btn-toggle-docs" class="btn-link">Hide</button>
    </div>
    <div id="docs-list">
      <p id="docs-empty">No documents uploaded.</p>
    </div>
  </div>

  <!-- Practice Tools Section (collapsed by default) -->
  <div id="tools-section" class="hidden">
    <div id="tools-header">
      <span>⚖️ Practice Tools</span>
      <button id="btn-toggle-tools" class="btn-link">Hide</button>
    </div>

    <div id="tools-body">
      <div class="tools-row">
        <label class="tools-label">Plugin</label>
        <select id="plugin-select" class="tools-select">
          <option value="">Select practice area...</option>
          <option value="commercial-legal">Commercial Legal</option>
          <option value="privacy-legal">Privacy Legal</option>
          <option value="litigation-legal">Litigation Legal</option>
          <option value="employment-legal">Employment Legal</option>
          <option value="product-legal">Product Legal</option>
          <option value="ip-legal">IP Legal</option>
          <option value="ai-governance-legal">AI Governance</option>
          <option value="regulatory-legal">Regulatory Legal</option>
        </select>
      </div>

      <div class="tools-row">
        <label class="tools-label">Skill</label>
        <select id="skill-select" class="tools-select" disabled>
          <option value="">Select skill...</option>
        </select>
      </div>

      <div class="tools-row">
        <button id="btn-review-selection" class="btn-secondary btn-small">
          Use Selected Text
        </button>
      </div>

      <textarea
        id="skill-input"
        class="tools-textarea"
        placeholder="Paste contract text, PRD, or question here..."
        rows="4"
      ></textarea>

      <div class="tools-row">
        <label class="tools-check-label">
          <input type="checkbox" id="skill-premium" />
          Use Premium LLM
        </label>
      </div>

      <button id="btn-run-skill" class="btn-primary btn-small" disabled>
        Run Skill
      </button>

      <div id="skill-output-area" class="hidden">
        <div id="skill-attorney-banner">⚠️ Requires Attorney Review</div>
        <div id="skill-gates"></div>
        <div id="skill-result-preview"></div>
        <div id="skill-result-full" class="hidden"></div>
        <div class="tools-row tools-actions">
          <button id="btn-show-full" class="btn-link btn-small hidden">Show full output</button>
          <button id="btn-insert-skill" class="btn-secondary btn-small">Insert into Document</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Nav tabs at bottom -->
  <div id="nav-tabs">
    <button class="nav-tab active" data-section="chat">Chat</button>
    <button class="nav-tab" data-section="tools">Tools</button>
    <button class="nav-tab" data-section="docs">Docs</button>
  </div>

  <!-- Status bar -->
  <div id="status-bar">
    <span id="status-text"></span>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
