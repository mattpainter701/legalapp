services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legalapp
      POSTGRES_PASSWORD: legalapp
      POSTGRES_DB: legalapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalapp -d legalapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    build:
      context: .
      dockerfile: litellm/Dockerfile
    image: legalapp-litellm:main-v1.72.6
    depends_on:
      litellm-postgres:
        condition: service_healthy
    environment:
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-local-litellm}
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://litellm:litellm@litellm-postgres:5432/litellm}
      STORE_MODEL_IN_DB: "True"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      OPENCODE_KEY: ${OPENCODE_KEY:-}
      OPENCODE_ZEN_BASE_URL: ${OPENCODE_ZEN_BASE_URL:-https://zen.opencode.ai/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:4000/health/liveliness > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Init service: runs migrations once, exits when complete.
  migrator:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:-${DATABASE_URL}}
    command: alembic upgrade head
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL}}
    volumes:
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    volumes:
      - frontend_dist:/app/dist
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    build: ./nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - frontend_dist:/usr/share/nginx/html/dist:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  litellm_postgres_data:
  uploads:
  frontend_dist:
