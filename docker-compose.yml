services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_USER: legalapp
      POSTGRES_PASSWORD: legalapp
      POSTGRES_DB: legalapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalapp -d legalapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm-postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LiteLLM owns a separate Prisma schema. Run upstream migrations first, then
  # an exact-diff reconciler that accepts only the reviewed 1.93 production
  # repair. The proxy cannot start when either step fails.
  litellm-migrator:
    image: legalapp-litellm:${APP_COMMIT:-dev}
    pull_policy: never
    depends_on:
      litellm-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://litellm:litellm@litellm-postgres:5432/litellm}
    entrypoint: ["prisma"]
    command: ["migrate", "deploy", "--schema", "/app/schema.prisma"]
    restart: "no"

  litellm-schema-migrator:
    image: legalapp-litellm:${APP_COMMIT:-dev}
    pull_policy: never
    depends_on:
      litellm-migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://litellm:litellm@litellm-postgres:5432/litellm}
      LITELLM_SCHEMA_REPAIR_ALLOWED: "true"
    entrypoint: ["/bin/sh"]
    command: ["/app/legalapp/reconcile_schema.sh"]
    restart: "no"

  litellm:
    build:
      context: .
      dockerfile: litellm/Dockerfile
    image: legalapp-litellm:${APP_COMMIT:-dev}
    depends_on:
      litellm-schema-migrator:
        condition: service_completed_successfully
    environment:
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-local-litellm}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-local-litellm-salt-key-not-for-production}
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://litellm:litellm@litellm-postgres:5432/litellm}
      DISABLE_SCHEMA_UPDATE: "true"
      STORE_MODEL_IN_DB: "True"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      OPENCODE_KEY: ${OPENCODE_KEY:-}
      OPENCODE_ZEN_BASE_URL: ${OPENCODE_ZEN_BASE_URL:-https://zen.opencode.ai/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Init service: runs migrations once, exits when complete.
  migrator:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:-${DATABASE_URL}}
    command: alembic upgrade head
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL}}
      APP_VERSION: ${APP_VERSION:-dev}
      APP_COMMIT: ${APP_COMMIT:-}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - ${UPLOADS_HOST_DIR:-./uploads}:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-}
        VITE_CONTACT_URL: ${VITE_CONTACT_URL:-}
        VITE_PUBLIC_SIGNUP_ENABLED: ${VITE_PUBLIC_SIGNUP_ENABLED:-false}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    build: ./nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  litellm_postgres_data:
