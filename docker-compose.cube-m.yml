# IONOS Memory Cube M production overlay.
#
# Pair this file with docker-compose.hypervisor.yml. The base file retains the
# private databases, authenticated Redis, single scheduler, loopback-only
# HTTPS origin, and data-guard topology. This overlay bounds the steady-state
# stack for the 4-vCPU/16-GB first-customer host without weakening those
# controls. Research corpus storage and embedding workers remain on Skynet.
name: legalapp

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "1.10"

  redis:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.15"

  litellm-postgres:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.30"

  litellm-migrator:
    # Prisma migrate deploy peaked just under 800 MiB while reconciling the
    # restored production schema. Keep this one-shot allowance above that
    # observed peak; the service exits before the steady-state proxy starts.
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "0.35"

  litellm-schema-migrator:
    # Prisma migrate diff has the same production-schema working set as the
    # preceding deploy step and also peaked just under 800 MiB. This one-shot
    # reconciler runs after litellm-migrator, so the allowances do not overlap.
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "0.35"

  litellm:
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "0.50"

  migrator:
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.35"

  backend:
    # Keep this fixed for the reviewed 16-GB profile. A carried-over Skynet
    # BACKEND_WORKERS value must not silently defeat the Cube M memory model.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    deploy:
      resources:
        limits:
          memory: 2560M
          cpus: "0.80"

  scheduler:
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.35"

  frontend:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.15"

  office-addin:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.10"

  nginx:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.10"
