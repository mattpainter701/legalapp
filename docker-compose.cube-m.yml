# IONOS Memory Cube M production overlay.
#
# Pair this file with docker-compose.hypervisor.yml. The base file retains the
# private databases, authenticated Redis, single scheduler, loopback-only
# HTTPS origin, and data-guard topology. This overlay bounds the steady-state
# stack for the 4-vCPU/16-GB first-customer host without weakening those
# controls. Research corpus storage and embedding workers remain on Skynet.
name: legalapp

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "1.10"

  redis:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.15"

  litellm-postgres:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.30"

  litellm-migrator:
    # Prisma migrate deploy peaked just under 800 MiB while reconciling the
    # restored production schema. Keep this one-shot allowance above that
    # observed peak; the service exits before the steady-state proxy starts.
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "0.35"

  litellm-schema-migrator:
    # Prisma migrate diff has the same production-schema working set as the
    # preceding deploy step and also peaked just under 800 MiB. This one-shot
    # reconciler runs after litellm-migrator, so the allowances do not overlap.
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "0.35"

  litellm:
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "0.50"

  migrator:
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.35"

  backend:
    # Keep this fixed for the reviewed 16-GB profile. A carried-over Skynet
    # BACKEND_WORKERS value must not silently defeat the Cube M memory model.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      # The host env file has never set these, so every process ran the code
      # default of 5 + 5 connections and the scheduler starved its pool on
      # 2026-09-11. Pin the reviewed production pool. Budget: every process
      # opens the request pool AND the generation pool, so it is
      # 2 backend workers x (6 + 6 + 3 + 2) + scheduler 17 = 51 pooled
      # connections against PostgreSQL's default max_connections of 100,
      # leaving room for the migrator, the scheduler's unpooled advisory
      # locks, backups and operator sessions. The request half shrank from
      # 8 + 8 because chat turns no longer contend for it: an ordinary request
      # holds a connection for milliseconds, a chat turn for the length of an
      # LLM call, and only the latter needed the headroom.
      DATABASE_POOL_SIZE: "6"
      DATABASE_MAX_OVERFLOW: "6"
      # Chat turns pin one connection each for the whole turn, so they get
      # their own pool: a burst of chat then cannot starve ordinary matter,
      # task and document reads. 3 + 2 per worker is 10 concurrent turns on
      # this two-worker profile.
      DATABASE_GENERATION_POOL_SIZE: "3"
      DATABASE_GENERATION_MAX_OVERFLOW: "2"
    deploy:
      resources:
        limits:
          memory: 2560M
          cpus: "0.80"

  scheduler:
    environment:
      # Same reviewed pool as the backend; see the budget note above. The
      # scheduler serves no chat traffic, so its generation pool stays idle —
      # SQLAlchemy opens connections lazily — but it is pinned here so the
      # connection budget holds even if a scheduled job ever takes a lease.
      DATABASE_POOL_SIZE: "6"
      DATABASE_MAX_OVERFLOW: "6"
      DATABASE_GENERATION_POOL_SIZE: "3"
      DATABASE_GENERATION_MAX_OVERFLOW: "2"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.35"

  # Activation is rejected by prod_env_preflight.sh on this 16-GB topology.
  # Retain a hard ceiling as defense if an operator bypasses that gate.
  studio-render-worker:
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.25"

  frontend:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.15"

  office-addin:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.10"

  nginx:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.10"
