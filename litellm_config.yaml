model_list:
  # Standard profile: low-cost/high-availability query routing.
  # Primary: OpenCode.ai via DEEPSEEK_BASE_URL (same key, faster endpoint than zen).
  - model_name: clarity-standard
    litellm_params:
      model: openai/deepseek-chat
      api_base: os.environ/DEEPSEEK_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: clarity-standard-openrouter-free
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: clarity-standard-openrouter-qwen
    litellm_params:
      model: openrouter/qwen/qwen3-235b-a22b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: clarity-standard-openrouter-llama
    litellm_params:
      model: openrouter/meta-llama/llama-4-maverick:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Premium profile: higher-quality drafting/reasoning route.
  - model_name: clarity-premium
    litellm_params:
      model: openai/deepseek-chat
      api_base: os.environ/DEEPSEEK_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: clarity-premium-openrouter-qwen
    litellm_params:
      model: openrouter/qwen/qwen3-235b-a22b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: clarity-premium-openrouter-llama
    litellm_params:
      model: openrouter/meta-llama/llama-4-maverick:free
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  drop_params: true
  turn_off_message_logging: true
  request_timeout: 60
  num_retries: 1
  allowed_fails: 2
  cooldown_time: 30
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

router_settings:
  routing_strategy: cost-based-routing
  fallbacks:
    - clarity-standard:
        - clarity-standard-openrouter-free
        - clarity-standard-openrouter-qwen
        - clarity-standard-openrouter-llama
    - clarity-premium:
        - clarity-premium-openrouter-qwen
        - clarity-premium-openrouter-llama

general_settings:
  master_key: os.environ/LITELLM_API_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
