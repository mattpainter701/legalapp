model_list:
  # Standard profile: low-cost/high-availability query routing.
  # Primary: OpenCode Zen/OpenAI-compatible endpoint.
  - model_name: clarity-standard
    litellm_params:
      model: openai/deepseek-chat
      api_base: os.environ/OPENCODE_ZEN_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: clarity-standard-openrouter-free
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: clarity-standard-openrouter-deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Premium profile: higher-quality drafting/reasoning route.
  # Primary: DeepSeek via DEEPSEEK_BASE_URL (deepseek-chat is the current stable alias).
  - model_name: clarity-premium
    litellm_params:
      model: openai/deepseek-chat
      api_base: os.environ/DEEPSEEK_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: clarity-premium-openrouter
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: clarity-premium-openrouter-qwen
    litellm_params:
      model: openrouter/qwen/qwen3-235b-a22b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Embeddings: routed through gateway for unified cost tracking
  - model_name: clarity-embeddings
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  turn_off_message_logging: true
  request_timeout: 120
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 60
  # Langfuse callbacks — only activate when LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY are set.
  # Silently skipped otherwise. Tracks latency, cost, and errors without logging message content.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

router_settings:
  routing_strategy: cost-based-routing
  fallbacks:
    - clarity-standard:
        - clarity-standard-openrouter-free
        - clarity-standard-openrouter-deepseek
    - clarity-premium:
        - clarity-premium-openrouter
        - clarity-premium-openrouter-qwen

general_settings:
  master_key: os.environ/LITELLM_API_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
