model_list:
  # Standard profile: cost-effective query routing.
  # Primary: OpenCode Zen.  This deployment has a configured OpenCode key;
  # routing through an unset OpenRouter key made the normal assistant fail
  # before LiteLLM could reach an alternate route.
  - model_name: clarity-standard
    litellm_params:
      model: openai/nemotron-3-ultra-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      timeout: 15  # fast failover to next model

  # Standard fallback: OpenCode zen Nemotron free.
  - model_name: clarity-standard-zen-nemotron
    litellm_params:
      model: openai/nemotron-3-ultra-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      timeout: 15

  # Standard fallback: OpenCode zen DeepSeek V4 Flash Free.
  - model_name: clarity-standard-deepseek-flash-free
    litellm_params:
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      timeout: 15

  # Premium profile: highest-quality drafting/reasoning.
  # Primary: OpenCode go DeepSeek V4 Pro (opencode.ai/zen/go/v1)
  - model_name: clarity-premium
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      timeout: 30

  # Premium fallback: fast free model for availability if premium provider stalls.
  - model_name: clarity-premium-openrouter-gemma
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 20

  # Platform-global Background Automations route. GPT 5.6 Luna uses the
  # Responses API on OpenCode Go; the application broker caps output, enforces
  # JSON schemas, and reserves shared request quota before this alias is called.
  # Production key pools are registered dynamically by Platform Management as
  # multiple deployments sharing the same versioned alias.
  - model_name: clarity-background
    litellm_params:
      model: openai/gpt-5.6-luna
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      timeout: 30

  # Metered Zen is the explicit low-cost escape hatch for Background. It never
  # falls through to clarity-premium.
  - model_name: clarity-background-zen
    litellm_params:
      model: openai/gpt-5.6-luna
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      timeout: 30

litellm_settings:
  drop_params: true
  turn_off_message_logging: true
  request_timeout: 25
  num_retries: 0
  allowed_fails: 1
  cooldown_time: 15

router_settings:
  # Multiple deployments under one alias are shuffled according to their
  # configured capacities; platform admission control owns the long windows.
  routing_strategy: simple-shuffle
  # Fail over inside the gateway so every request keeps the app-selected route
  # and provider outages do not surface as a generic chat failure.
  fallbacks:
    - clarity-standard:
        - clarity-standard-deepseek-flash-free
    # Premium OpenCode Go can return capacity errors independently of the
    # standard route. Preserve the premium alias while keeping customer chat
    # available through the configured standard chain when that happens.
    - clarity-premium:
        - clarity-standard
    - clarity-background:
        - clarity-background-zen

general_settings:
  master_key: os.environ/LITELLM_API_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
