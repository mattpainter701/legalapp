model_list:
  # Standard profile: cost-effective query routing.
  # Primary: OpenRouter Gemma free. Live smoke on 2026-06-27 showed this is
  # materially faster than the OpenCode free models with LegalApp's full prompt.
  - model_name: clarity-standard
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 15  # fast failover to next model

  # Standard fallback: OpenCode zen Nemotron free.
  - model_name: clarity-standard-zen-nemotron
    litellm_params:
      model: openai/nemotron-3-ultra-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 15

  # Standard fallback: OpenCode zen DeepSeek V4 Flash Free.
  - model_name: clarity-standard-deepseek-flash-free
    litellm_params:
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 15

  # Premium profile: highest-quality drafting/reasoning.
  # Primary: OpenCode go DeepSeek V4 Pro (opencode.ai/zen/go/v1)
  - model_name: clarity-premium
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 30

  # Premium fallback: fast free model for availability if premium provider stalls.
  - model_name: clarity-premium-openrouter-gemma
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 20

litellm_settings:
  drop_params: true
  turn_off_message_logging: true
  request_timeout: 25
  num_retries: 0
  allowed_fails: 1
  cooldown_time: 15

router_settings:
  routing_strategy: cost-based-routing
  # Fail over inside the gateway so every request keeps the app-selected route
  # and provider outages do not surface as a generic chat failure.
  fallbacks:
    - clarity-standard:
        - clarity-standard-deepseek-flash-free
    - clarity-premium:
        - clarity-standard-deepseek-flash-free

general_settings:
  master_key: os.environ/LITELLM_API_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
