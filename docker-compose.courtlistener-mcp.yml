services:
  courtlistener-db:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_USER: ${COURTLISTENER_DB_USER:-courtlistener}
      POSTGRES_PASSWORD: ${COURTLISTENER_DB_PASSWORD:?Set COURTLISTENER_DB_PASSWORD in .env}
      POSTGRES_DB: ${COURTLISTENER_DB_NAME:-courtlistener}
    volumes:
      - courtlistener_pgdata:/var/lib/postgresql/data
    ports:
      - "${COURTLISTENER_DB_BIND:-127.0.0.1}:${COURTLISTENER_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COURTLISTENER_DB_USER:-courtlistener} -d ${COURTLISTENER_DB_NAME:-courtlistener}"]
      interval: 10s
      timeout: 5s
      retries: 5

  courtlistener-mcp:
    build: ./mcp-server
    depends_on:
      courtlistener-db:
        condition: service_healthy
    environment:
      VECTORDB_URL: postgresql://${COURTLISTENER_DB_USER:-courtlistener}:${COURTLISTENER_DB_PASSWORD:?Set COURTLISTENER_DB_PASSWORD in .env}@courtlistener-db:5432/${COURTLISTENER_DB_NAME:-courtlistener}
      COURTLISTENER_API_KEY: ${COURTLISTENER_API_KEY:-}
      MCP_UPSTREAM_API_KEY: ${MCP_UPSTREAM_API_KEY:-}
      MCP_QUERY_EMBEDDING_URL: ${MCP_QUERY_EMBEDDING_URL:-}
      MCP_QUERY_EMBEDDING_MODEL: ${MCP_QUERY_EMBEDDING_MODEL:-mixedbread-ai/mxbai-embed-large-v1}
      MCP_QUERY_EMBEDDING_TIMEOUT_SECONDS: ${MCP_QUERY_EMBEDDING_TIMEOUT_SECONDS:-5}
    ports:
      - "${COURTLISTENER_MCP_BIND:-127.0.0.1}:${COURTLISTENER_MCP_PORT:-8021}:8021"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8021/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5

  courtlistener-loader:
    build: ./mcp-server
    profiles: ["loader"]
    depends_on:
      courtlistener-db:
        condition: service_healthy
    environment:
      VECTORDB_URL: postgresql://${COURTLISTENER_DB_USER:-courtlistener}:${COURTLISTENER_DB_PASSWORD:?Set COURTLISTENER_DB_PASSWORD in .env}@courtlistener-db:5432/${COURTLISTENER_DB_NAME:-courtlistener}
      COURTLISTENER_MVP_STATES: ${COURTLISTENER_MVP_STATES:-ND,MT,MN,SD}
      COURTLISTENER_MVP_SPECIALTY: ${COURTLISTENER_MVP_SPECIALTY:-true}
      COURTLISTENER_MVP_SCOTUS: ${COURTLISTENER_MVP_SCOTUS:-true}
      COURTLISTENER_COVERAGE_PROFILE: ${COURTLISTENER_COVERAGE_PROFILE:-federal-appellate}
      COURTLISTENER_EXTRA_COURT_IDS: ${COURTLISTENER_EXTRA_COURT_IDS:-}
    volumes:
      - courtlistener_bulk:/data/courtlistener
    command: ["python", "-m", "mcp_server.loader", "--init-schema"]

  courtlistener-sync:
    build: ./mcp-server
    profiles: ["sync"]
    depends_on:
      courtlistener-db:
        condition: service_healthy
    environment:
      VECTORDB_URL: postgresql://${COURTLISTENER_DB_USER:-courtlistener}:${COURTLISTENER_DB_PASSWORD:?Set COURTLISTENER_DB_PASSWORD in .env}@courtlistener-db:5432/${COURTLISTENER_DB_NAME:-courtlistener}
      COURTLISTENER_API_KEY: ${COURTLISTENER_API_KEY:-}
      COURTLISTENER_SYNC_COURT_IDS: ${COURTLISTENER_SYNC_COURT_IDS:-}
      COURTLISTENER_SYNC_BASELINE_START: ${COURTLISTENER_SYNC_BASELINE_START:-2015-01-01}
      COURTLISTENER_SYNC_OVERLAP_HOURS: ${COURTLISTENER_SYNC_OVERLAP_HOURS:-48}
      COURTLISTENER_SYNC_TIMEOUT_SECONDS: ${COURTLISTENER_SYNC_TIMEOUT_SECONDS:-30}
      COURTLISTENER_SYNC_MAX_PAGES: ${COURTLISTENER_SYNC_MAX_PAGES:-}
    command: ["python", "-m", "mcp_server.sync", "--interval-seconds", "${COURTLISTENER_SYNC_INTERVAL_SECONDS:-86400}"]

  # Invoked only by scripts/courtlistener_rag_backup.sh.  Both corpus volumes
  # are mounted read-only; the caller supplies an explicit, private host backup
  # directory at /backup for immutable artifacts.
  courtlistener-rag-artifact:
    build: ./mcp-server
    profiles: ["rag-backup"]
    volumes:
      - ./scripts:/scripts:ro
      - courtlistener_bulk:/data/courtlistener:ro
      - legal_authority_cache:/data/legal-authority:ro

  legal-authority-sync:
    build: ./mcp-server
    profiles: ["authority-sync"]
    restart: unless-stopped
    depends_on:
      courtlistener-db:
        condition: service_healthy
    environment:
      VECTORDB_URL: postgresql://${COURTLISTENER_DB_USER:-courtlistener}:${COURTLISTENER_DB_PASSWORD:?Set COURTLISTENER_DB_PASSWORD in .env}@courtlistener-db:5432/${COURTLISTENER_DB_NAME:-courtlistener}
      LEGAL_SOURCE_USER_AGENT: ${LEGAL_SOURCE_USER_AGENT:?Set a descriptive legal-source contact User-Agent in .env}
      LEGAL_AUTHORITY_SYNC_INTERVAL_SECONDS: ${LEGAL_AUTHORITY_SYNC_INTERVAL_SECONDS:-86400}
      LEGAL_AUTHORITY_JOB_TIMEOUT_SECONDS: ${LEGAL_AUTHORITY_JOB_TIMEOUT_SECONDS:-21600}
      LEGAL_AUTHORITY_USCODE_ENABLED: ${LEGAL_AUTHORITY_USCODE_ENABLED:-true}
      LEGAL_AUTHORITY_USCODE_TITLES: ${LEGAL_AUTHORITY_USCODE_TITLES:-11,15,26,28,29,31,42}
      LEGAL_AUTHORITY_ECFR_ENABLED: ${LEGAL_AUTHORITY_ECFR_ENABLED:-true}
      LEGAL_AUTHORITY_ECFR_TITLES: ${LEGAL_AUTHORITY_ECFR_TITLES:-all}
      LEGAL_AUTHORITY_CMS_ENABLED: ${LEGAL_AUTHORITY_CMS_ENABLED:-true}
      LEGAL_AUTHORITY_BENEFITS_ENABLED: ${LEGAL_AUTHORITY_BENEFITS_ENABLED:-true}
      LEGAL_AUTHORITY_IRS_ENABLED: ${LEGAL_AUTHORITY_IRS_ENABLED:-true}
      LEGAL_AUTHORITY_IRS_DAILY_LIMIT: ${LEGAL_AUTHORITY_IRS_DAILY_LIMIT:-12}
      LEGAL_AUTHORITY_OHIO_ENABLED: ${LEGAL_AUTHORITY_OHIO_ENABLED:-true}
      LEGAL_AUTHORITY_ND_ENABLED: ${LEGAL_AUTHORITY_ND_ENABLED:-false}
      OHIO_COURTS_CRAWLER_CONTACT: ${OHIO_COURTS_CRAWLER_CONTACT:?Set the Ohio crawler contact email in .env}
      OHIO_COURTS_AUTHORIZATION_BASIS: ${OHIO_COURTS_AUTHORIZATION_BASIS:-Direct crawl permission reported by the LegalApp operator; retain correspondence in the production compliance record}
      OHIO_COURT_CRAWL_DELAY_SECONDS: ${OHIO_COURT_CRAWL_DELAY_SECONDS:-2}
      OHIO_COURT_MAX_DOWNLOAD_BYTES: ${OHIO_COURT_MAX_DOWNLOAD_BYTES:-52428800}
      ND_AUTHORITY_CRAWLER_CONTACT: ${ND_AUTHORITY_CRAWLER_CONTACT:-}
      ND_AUTHORITY_CRAWL_DELAY_SECONDS: ${ND_AUTHORITY_CRAWL_DELAY_SECONDS:-2}
    volumes:
      - legal_authority_cache:/data/legal-authority
    command: ["python", "-m", "mcp_server.authority_scheduler"]

  embedding-dispatcher:
    build: ./mcp-server
    profiles: ["embedding"]
    depends_on:
      courtlistener-db:
        condition: service_healthy
    environment:
      VECTORDB_URL: postgresql://${COURTLISTENER_DB_USER:-courtlistener}:${COURTLISTENER_DB_PASSWORD:?Set COURTLISTENER_DB_PASSWORD in .env}@${COURTLISTENER_DB_HOST_FOR_JETSON:-172.16.16.202}:${COURTLISTENER_DB_PORT:-5434}/${COURTLISTENER_DB_NAME:-courtlistener}
      JETSON_HOSTS: ${JETSON_HOSTS:-}
      JETSON_0_HOST: ${JETSON_0_HOST:-}
      JETSON_1_HOST: ${JETSON_1_HOST:-}
      JETSON_2_HOST: ${JETSON_2_HOST:-}
      JETSON_3_HOST: ${JETSON_3_HOST:-}
      JETSON0_HOST: ${JETSON0_HOST:-}
      JETSON1_HOST: ${JETSON1_HOST:-}
      JETSON2_HOST: ${JETSON2_HOST:-}
      JETSON3_HOST: ${JETSON3_HOST:-}
      JETSON_USER: ${JETSON_USER:-jetson}
      JETSON_0_USER: ${JETSON_0_USER:-}
      JETSON_1_USER: ${JETSON_1_USER:-}
      JETSON_1_PASSWORD: ${JETSON_1_PASSWORD:-}
      JETSON_2_USER: ${JETSON_2_USER:-}
      JETSON_3_USER: ${JETSON_3_USER:-}
      JETSON_3_PASSWORD: ${JETSON_3_PASSWORD:-}
      JETSON0_USER: ${JETSON0_USER:-}
      JETSON1_USER: ${JETSON1_USER:-}
      JETSON2_USER: ${JETSON2_USER:-}
      JETSON3_USER: ${JETSON3_USER:-}
      JETSON_SCRIPT_DIR: ${JETSON_SCRIPT_DIR:-/home/jetson/legalapp/scripts}
      BATCH_SIZE: ${BATCH_SIZE:-32}
      JETSON_DB_REVERSE_TUNNEL: ${JETSON_DB_REVERSE_TUNNEL:-false}
      JETSON_DB_TUNNEL_REMOTE_PORT_BASE: ${JETSON_DB_TUNNEL_REMOTE_PORT_BASE:-15434}
    command: ["python", "-m", "mcp_server.dispatcher"]

  embedding-scheduler:
    build: ./mcp-server
    profiles: ["embedding-scheduler"]
    network_mode: host
    depends_on:
      courtlistener-db:
        condition: service_healthy
    environment:
      SCHEDULER_DB_URL: postgresql://${COURTLISTENER_DB_USER:-courtlistener}:${COURTLISTENER_DB_PASSWORD:?Set COURTLISTENER_DB_PASSWORD in .env}@${COURTLISTENER_DB_HOST_FOR_SCHEDULER:-127.0.0.1}:${COURTLISTENER_DB_PORT:-5434}/${COURTLISTENER_DB_NAME:-courtlistener}
      VECTORDB_URL: postgresql://${COURTLISTENER_DB_USER:-courtlistener}:${COURTLISTENER_DB_PASSWORD:?Set COURTLISTENER_DB_PASSWORD in .env}@${COURTLISTENER_DB_HOST_FOR_JETSON:-127.0.0.1}:${COURTLISTENER_DB_PORT:-5434}/${COURTLISTENER_DB_NAME:-courtlistener}
      JETSON_HOSTS: ${JETSON_HOSTS:-}
      JETSON_0_HOST: ${JETSON_0_HOST:-}
      JETSON_1_HOST: ${JETSON_1_HOST:-}
      JETSON_2_HOST: ${JETSON_2_HOST:-}
      JETSON_3_HOST: ${JETSON_3_HOST:-}
      JETSON0_HOST: ${JETSON0_HOST:-}
      JETSON1_HOST: ${JETSON1_HOST:-}
      JETSON2_HOST: ${JETSON2_HOST:-}
      JETSON3_HOST: ${JETSON3_HOST:-}
      JETSON_USER: ${JETSON_USER:-jetson}
      JETSON_0_USER: ${JETSON_0_USER:-}
      JETSON_1_USER: ${JETSON_1_USER:-}
      JETSON_1_PASSWORD: ${JETSON_1_PASSWORD:-}
      JETSON_2_USER: ${JETSON_2_USER:-}
      JETSON_3_USER: ${JETSON_3_USER:-}
      JETSON_3_PASSWORD: ${JETSON_3_PASSWORD:-}
      JETSON0_USER: ${JETSON0_USER:-}
      JETSON1_USER: ${JETSON1_USER:-}
      JETSON2_USER: ${JETSON2_USER:-}
      JETSON3_USER: ${JETSON3_USER:-}
      JETSON_SCRIPT_DIR: ${JETSON_SCRIPT_DIR:-/home/jetson/legalapp/scripts}
      BATCH_SIZE: ${BATCH_SIZE:-32}
      JETSON_DB_REVERSE_TUNNEL: ${JETSON_DB_REVERSE_TUNNEL:-false}
      JETSON_DB_TUNNEL_REMOTE_PORT_BASE: ${JETSON_DB_TUNNEL_REMOTE_PORT_BASE:-15434}
      EMBEDDING_SCHEDULER_INTERVAL_SECONDS: ${EMBEDDING_SCHEDULER_INTERVAL_SECONDS:-900}
      EMBEDDING_SCHEDULER_MINIMUM_UNEMBEDDED: ${EMBEDDING_SCHEDULER_MINIMUM_UNEMBEDDED:-1}
      EMBEDDING_SCHEDULER_LOCK_ID: ${EMBEDDING_SCHEDULER_LOCK_ID:-2026062901}
      EMBEDDING_SCHEDULER_RETRY_INITIAL_SECONDS: ${EMBEDDING_SCHEDULER_RETRY_INITIAL_SECONDS:-60}
      EMBEDDING_SCHEDULER_RETRY_MAX_SECONDS: ${EMBEDDING_SCHEDULER_RETRY_MAX_SECONDS:-900}
    command: ["python", "-m", "mcp_server.embedding_scheduler"]

volumes:
  courtlistener_pgdata:
  courtlistener_bulk:
  legal_authority_cache:
