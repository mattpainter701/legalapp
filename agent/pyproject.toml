[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity-agent"
version = "0.12.0"
description = "LawHand SMB File Share Relay Agent"
requires-python = ">=3.11"
dependencies = [
    "smbprotocol>=1.16.1",
    "httpx>=0.27.0",
    "pypdf>=4.0",
    "python-docx>=1.1.0",
    "cryptography>=42.0",
    "aiosqlite>=0.20.0",
    "tomli_w>=1.0",
    "tomli>=2.0;python_version<'3.11'",
]

[project.scripts]
clarity-agent = "clarity_agent.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
