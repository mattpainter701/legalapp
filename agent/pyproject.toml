[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity-agent"
version = "0.15.4"
description = "LawHand SMB File Share Relay Agent"
requires-python = ">=3.11"
dependencies = [
    "smbprotocol>=1.16.1",
    "httpx>=0.27.0",
    # Use the operating system CA store, including managed Windows roots.
    "truststore>=0.10.1",
    "pypdf>=4.0",
    "python-docx>=1.1.0",
    "cryptography>=42.0",
    "aiosqlite>=0.20.0",
    "tomli_w>=1.0",
    "tomli>=2.0;python_version<'3.11'",
]

# The repo layout now also holds packaging/ and tests/ beside the package, which
# setuptools' flat-layout auto-discovery refuses to guess between.
[tool.setuptools]
packages = ["clarity_agent"]

[project.scripts]
# ``lawhand-agent`` is the documented name; the old one stays for installed agents.
lawhand-agent = "clarity_agent.__main__:main"
clarity-agent = "clarity_agent.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
# Windows service host (pywin32) — installed by the packaged MSI build.
windows = ["pywin32>=306;sys_platform=='win32'"]
# Everything the installer build needs on top of the runtime dependencies.
build = ["pyinstaller>=6.6", "pywin32>=306;sys_platform=='win32'"]
