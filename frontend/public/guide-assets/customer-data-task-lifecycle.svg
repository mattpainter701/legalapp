<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Task routing and customer-owned document storage</title>
  <desc id="desc">Two workflow lanes show how requests become authoritative LawHand tasks with calendar projections, and how client uploads pass a fail-closed gate into the tenant's own cloud storage while LawHand retains only control-plane records.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#161817" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#66706B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#3157D5"/>
    </marker>
    <style>
      .title{font:500 34px Inter,Segoe UI,Arial,sans-serif;fill:#161817}
      .subtitle{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#66706B}
      .lane-title{font:500 23px Inter,Segoe UI,Arial,sans-serif;fill:#161817}
      .lane-kicker{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#3157D5;letter-spacing:1.4px}
      .card-title{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#161817}
      .body{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#343A37}
      .small{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#66706B}
      .small-dark{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#343A37}
      .white{fill:#FFF}
      .blue{fill:#3157D5}
      .green{fill:#5A7A5C}
      .amber{fill:#C28B2B}
      .line{fill:none;stroke:#66706B;stroke-width:2;marker-end:url(#arrow)}
      .line-blue{fill:none;stroke:#3157D5;stroke-width:2.5;marker-end:url(#arrow-blue)}
      .line-dotted{fill:none;stroke:#66706B;stroke-width:2;stroke-dasharray:5 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1440" height="920" rx="24" fill="#F4F0E8"/>
  <text x="60" y="62" class="title">One workflow record. Customer-owned file content.</text>
  <text x="60" y="94" class="subtitle">LawHand owns task state and audit history; the tenant's selected cloud owns durable document bytes.</text>

  <rect x="40" y="126" width="1360" height="300" rx="22" fill="#FFF" stroke="#DCD7CE"/>
  <text x="70" y="163" class="lane-kicker">TASK LIFECYCLE</text>
  <text x="70" y="194" class="lane-title">Requests become accountable work</text>

  <g filter="url(#shadow)">
    <rect x="70" y="222" width="220" height="164" rx="16" fill="#F8F6F1" stroke="#DCD7CE"/>
    <text x="92" y="251" class="card-title">Creation sources</text>
    <circle cx="96" cy="278" r="4" fill="#3157D5"/><text x="110" y="283" class="body">User or API</text>
    <circle cx="96" cy="304" r="4" fill="#3157D5"/><text x="110" y="309" class="body">Intake or automation</text>
    <circle cx="96" cy="330" r="4" fill="#3157D5"/><text x="110" y="335" class="body">Reviewed tagged email</text>
    <circle cx="96" cy="356" r="4" fill="#3157D5"/><text x="110" y="361" class="body">Approved document signal</text>
  </g>

  <path d="M290 304H342" class="line"/>

  <g filter="url(#shadow)">
    <rect x="344" y="241" width="220" height="126" rx="16" fill="#FFF" stroke="#DCD7CE"/>
    <text x="366" y="272" class="card-title">Validate &amp; route</text>
    <text x="366" y="300" class="body">Tenant • matter • owner</text>
    <text x="366" y="324" class="body">due date • priority • source</text>
    <rect x="366" y="338" width="120" height="18" rx="9" fill="#ECE7DE"/>
    <text x="378" y="351" class="small-dark">explicit action</text>
  </g>

  <path d="M564 304H616" class="line-blue"/>

  <g filter="url(#shadow)">
    <rect x="618" y="220" width="250" height="168" rx="18" fill="#3157D5"/>
    <text x="642" y="254" class="card-title white">LawHand task</text>
    <text x="642" y="282" class="body white">Authoritative status &amp; owner</text>
    <text x="642" y="307" class="body white">Due date, matter, provenance</text>
    <text x="642" y="332" class="body white">TaskEvent history &amp; audit</text>
    <rect x="642" y="350" width="169" height="22" rx="11" fill="#FFF" fill-opacity=".17"/>
    <text x="655" y="365" class="small-dark white">SYSTEM OF RECORD</text>
  </g>

  <path d="M868 304H920" class="line"/>

  <g filter="url(#shadow)">
    <rect x="922" y="241" width="198" height="126" rx="16" fill="#F8F6F1" stroke="#DCD7CE"/>
    <text x="944" y="272" class="card-title">Managed lifecycle</text>
    <text x="944" y="300" class="body">Assign • remind • reassign</text>
    <text x="944" y="324" class="body">complete • cancel • report</text>
    <text x="944" y="349" class="small">Every transition is recorded.</text>
  </g>

  <path d="M1120 304H1172" class="line"/>

  <g filter="url(#shadow)">
    <rect x="1174" y="222" width="196" height="164" rx="16" fill="#F8F6F1" stroke="#DCD7CE"/>
    <text x="1196" y="251" class="card-title">Projections</text>
    <text x="1196" y="280" class="body">Outlook / Google calendar</text>
    <text x="1196" y="305" class="body">Email &amp; app notifications</text>
    <text x="1196" y="336" class="small">Useful views—not a second</text>
    <text x="1196" y="354" class="small">task database.</text>
    <path d="M1258 376C1218 408 940 408 826 379" class="line-dotted"/>
  </g>

  <rect x="40" y="446" width="1360" height="430" rx="22" fill="#FFF" stroke="#DCD7CE"/>
  <text x="70" y="483" class="lane-kicker">DOCUMENT CONTENT LIFECYCLE</text>
  <text x="70" y="514" class="lane-title">Portal uploads land in the tenant datastore</text>

  <g filter="url(#shadow)">
    <rect x="70" y="548" width="210" height="132" rx="16" fill="#F8F6F1" stroke="#DCD7CE"/>
    <text x="92" y="579" class="card-title">Ingress</text>
    <text x="92" y="607" class="body">Client portal</text>
    <text x="92" y="632" class="body">Firm upload or inbound email</text>
    <text x="92" y="658" class="small">Request bytes are transient.</text>
  </g>

  <path d="M280 614H326" class="line"/>

  <g filter="url(#shadow)">
    <rect x="328" y="548" width="210" height="132" rx="16" fill="#FFF" stroke="#DCD7CE"/>
    <text x="350" y="579" class="card-title">Validate</text>
    <text x="350" y="607" class="body">Matter scope • type • size</text>
    <text x="350" y="632" class="body">filename • permissions</text>
    <text x="350" y="658" class="small">No durable host staging.</text>
  </g>

  <path d="M538 614H584" class="line-blue"/>

  <g filter="url(#shadow)">
    <path d="M648 538 712 614 648 690 584 614Z" fill="#FFF8E8" stroke="#C28B2B" stroke-width="2"/>
    <text x="648" y="589" text-anchor="middle" class="card-title">Cloud write</text>
    <text x="648" y="613" text-anchor="middle" class="body">succeeds?</text>
    <text x="648" y="640" text-anchor="middle" class="small-dark">FAIL CLOSED</text>
    <text x="648" y="658" text-anchor="middle" class="small">503 + retry</text>
  </g>

  <path d="M712 614H758" class="line-blue"/>

  <g filter="url(#shadow)">
    <rect x="760" y="536" width="312" height="156" rx="18" fill="#EEF4ED" stroke="#5A7A5C" stroke-width="2"/>
    <text x="784" y="570" class="card-title">Tenant-owned cloud</text>
    <text x="784" y="598" class="body">Microsoft 365 → OneDrive by default</text>
    <text x="784" y="623" class="body">Admin may select SharePoint or Google</text>
    <rect x="784" y="642" width="264" height="28" rx="8" fill="#FFF"/>
    <text x="797" y="661" class="small-dark">/{matter}/client_uploads/original.pdf</text>
  </g>

  <path d="M1072 614H1120" class="line-dotted"/>

  <g filter="url(#shadow)">
    <rect x="1122" y="536" width="248" height="156" rx="18" fill="#F8F6F1" stroke="#DCD7CE"/>
    <text x="1146" y="570" class="card-title">LawHand control plane</text>
    <text x="1146" y="598" class="body">Provider and object IDs</text>
    <text x="1146" y="623" class="body">hash • size • category</text>
    <text x="1146" y="648" class="body">matter link • audit events</text>
    <text x="1146" y="675" class="small-dark">NO DURABLE SOURCE BYTES</text>
  </g>

  <path d="M883 692V720" class="line"/>

  <g filter="url(#shadow)">
    <rect x="760" y="728" width="246" height="112" rx="16" fill="#FFF" stroke="#DCD7CE"/>
    <text x="784" y="759" class="card-title">Original stays put</text>
    <text x="784" y="787" class="body">Stable provider ID and intake trail</text>
    <text x="784" y="813" class="small">Classification does not move evidence.</text>
  </g>

  <path d="M1006 784H1052" class="line"/>

  <g filter="url(#shadow)">
    <rect x="1054" y="728" width="316" height="112" rx="16" fill="#FFF" stroke="#3157D5" stroke-width="2"/>
    <text x="1078" y="759" class="card-title">Reviewed derivative</text>
    <text x="1078" y="787" class="body">Save a new version to the proper folder:</text>
    <text x="1078" y="814" class="small-dark">documents • pleadings • correspondence</text>
  </g>
</svg>
