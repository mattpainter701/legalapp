<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">WellPled document header</title>
  <desc id="desc">A restrained WellPled header for reports and exported documents.</desc>
  <rect width="1200" height="200" fill="#FFFDF9"/>
  <image href="wellpled-mark.svg" x="58" y="52" width="118" height="84"/>
  <text x="194" y="118" fill="#14253B" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="-1.6">WellPled</text>
  <text x="1140" y="91" text-anchor="end" fill="#5A7A5C" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="2.5">PRACTICE, WELL PLAYED.</text>
  <text x="1140" y="120" text-anchor="end" fill="#6A7587" font-family="Inter, Arial, sans-serif" font-size="15">Every matter. Fully in context.</text>
  <line x1="58" y1="167" x2="1140" y2="167" stroke="#D8CEBC" stroke-width="1"/>
  <line x1="58" y1="167" x2="276" y2="167" stroke="#B8965A" stroke-width="3"/>
</svg>
