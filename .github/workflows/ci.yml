# =============================================================================
# CI Pipeline — Clarity Legal
# =============================================================================
# Runs on every pull request targeting main, and on every push to main.
#
# Required GitHub repository secrets: none (CI uses fake/test values).
# Optional secrets for extended checks:
#   CODECOV_TOKEN — upload coverage to Codecov
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─── Backend: Linting ───────────────────────────────────────────────────────
  lint-backend:
    name: Backend — Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: ruff check (lint)
        run: ruff check backend/app/

      - name: ruff format (style check)
        run: ruff format --check backend/app/

  # ─── Backend: Tests ─────────────────────────────────────────────────────────
  test-backend:
    name: Backend — Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: legalapp_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U test -d legalapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # Database
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/legalapp_test
      RLS_TEST_DATABASE_URL: postgresql+asyncpg://clarity_app:clarity-ci-runtime-password@localhost:5432/legalapp_test

      # Redis
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/15

      # Auth
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      TOKEN_ENCRYPTION_KEY: KxzLuxmIM2dFDWQmKJL9LVUK5ouA0c3_-4VqCMrn-jY=
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440

      # OAuth (fake keys — OAuth flows are mocked in tests)
      MICROSOFT_CLIENT_ID: fake-ms-client-id
      MICROSOFT_CLIENT_SECRET: fake-ms-client-secret
      MICROSOFT_TENANT_ID: common
      GOOGLE_CLIENT_ID: fake-google-client-id
      GOOGLE_CLIENT_SECRET: fake-google-client-secret

      # LLM APIs (fake — LLM calls are mocked in tests)
      OPENAI_API_KEY: sk-test-00000000000000000000000000000000
      DEEPSEEK_API_KEY: fake-deepseek-key
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
      ANTHROPIC_API_KEY: sk-ant-test-00000000000000000000000000000000

      # Stripe (fake — Stripe calls are mocked in tests)
      STRIPE_SECRET_KEY: sk_test_00000000000000000000000000000000
      STRIPE_WEBHOOK_SECRET: whsec_test_00000000000000000000000000000000

      # App config
      FRONTEND_URL: http://localhost:3000
      UPLOAD_DIR: /tmp/legalapp_test_uploads
      MAX_FILE_SIZE_MB: 50
      PRIMARY_LLM: deepseek-chat
      PREMIUM_LLM: claude-opus-4-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Provision least-privilege runtime role for RLS tests
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d legalapp_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE clarity_app LOGIN PASSWORD 'clarity-ci-runtime-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE legalapp_test TO clarity_app;
          GRANT USAGE ON SCHEMA public TO clarity_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO clarity_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO clarity_app;
          SQL

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short --maxfail=1

  # ─── Frontend: Build validation ─────────────────────────────────────────────
  lint-frontend:
    name: Frontend — Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend (validates TypeScript + Vite bundle)
        working-directory: frontend
        run: npm run build

      - name: Verify frontend image delivery and stale-volume rejection
        run: sh scripts/test_frontend_image_delivery.sh

      - name: Verify nginx Zoom webhook ingress policy
        run: sh scripts/test_nginx_webhook_ingress.sh
