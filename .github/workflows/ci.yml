# =============================================================================
# CI Pipeline — Clarity Legal
# =============================================================================
# Runs on every pull request targeting main, and on every push to main.
#
# Required GitHub repository secrets: none (CI uses fake/test values).
# Optional secrets for extended checks:
#   CODECOV_TOKEN — upload coverage to Codecov
# =============================================================================

name: CI

# Every CI job needs only repository contents. Deployment and token-bearing
# operations belong in their dedicated workflows.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Recovery path for GitHub pull_request event-delivery incidents. This runs
  # the exact same required jobs against the explicitly selected ref.
  workflow_dispatch:

jobs:
  # Dedicated branch-protection gate for customer data. A fresh-schema test is
  # not enough: this job rehearses the upgrade over two populated tenants and
  # then audits the resulting PostgreSQL RLS catalog with the production-shaped
  # NOBYPASSRLS runtime role.
  tenant-data-safety:
    name: Tenant data safety - migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: legalapp_safety
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U test -d legalapp_safety"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/legalapp_safety
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/legalapp_safety
      RLS_TEST_DATABASE_URL: postgresql+asyncpg://clarity_safety:clarity-ci-safety-password@127.0.0.1:5432/legalapp_safety
      SECRET_KEY: ci-tenant-safety-secret-not-for-production
      TOKEN_ENCRYPTION_KEY: KxzLuxmIM2dFDWQmKJL9LVUK5ouA0c3_-4VqCMrn-jY=
      PYTHONPATH: backend

    steps:
      - name: Checkout full history for migration diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1 (Node.js 24)
        with:
          fetch-depth: 0

      - name: Resolve the deployed production migration baseline
        run: |
          git fetch --force origin refs/tags/production:refs/tags/production
          migration_diff_base="$(git rev-parse 'refs/tags/production^{commit}')"
          git merge-base --is-ancestor "$migration_diff_base" "$GITHUB_SHA"
          echo "MIGRATION_DIFF_BASE=$migration_diff_base" >> "$GITHUB_ENV"

      - name: Reject destructive or rewritten migrations
        run: >-
          python scripts/check_migration_safety.py
          --base "$MIGRATION_DIFF_BASE"
          --head "$GITHUB_SHA"

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3 (Node.js 24)
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Rehearse upgrade over two-tenant customer data
        run: >-
          python scripts/rehearse_tenant_migration.py
          --base "$MIGRATION_DIFF_BASE"
          --head "$GITHUB_SHA"

      - name: Provision production-shaped runtime role
        env:
          PGPASSWORD: test
        run: |
          psql -h 127.0.0.1 -U test -d legalapp_safety -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE clarity_safety LOGIN PASSWORD 'clarity-ci-safety-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE legalapp_safety TO clarity_safety;
          GRANT USAGE ON SCHEMA public TO clarity_safety;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO clarity_safety;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO clarity_safety;
          SQL

      - name: Verify tenant schema and effective isolation
        run: python scripts/verify_tenant_schema.py

  # ─── Backend: Linting ───────────────────────────────────────────────────────
  lint-backend:
    name: Backend — Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1 (Node.js 24)
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3 (Node.js 24)
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: ruff check (lint)
        run: ruff check backend/app/

      - name: ruff format (style check)
        run: ruff format --check backend/app/

      - name: Render and verify host disk systemd units
        run: bash scripts/test_host_disk_systemd_units.sh

      - name: Verify isolated Skynet dev1 topology
        run: bash scripts/test_dev1_topology.sh

      - name: Validate production TLS and certificate scripts
        run: >-
          bash -n
          scripts/validate_private_origin_tls.sh
          scripts/provision_private_origin_tls.sh
          scripts/finalize_private_origin_ca_rotation.sh
          scripts/prod_env_preflight.sh
          scripts/production_check.sh
          nginx/init-letsencrypt.sh
          scripts/deploy_dev1.sh
          scripts/install_dev1_deploy_entrypoint.sh
          scripts/skynet_dr_rehearsal.sh
          scripts/install_skynet_dr_services.sh
          scripts/test_dev1_topology.sh
          nginx/renew-cert.sh

  authority-control-plane-rehearsal:
    name: Authority control-plane DB rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: authority_rehearsal
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U test -d authority_rehearsal"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      AUTHORITY_REHEARSAL_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/authority_rehearsal
      PYTHONPATH: mcp-server
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install MCP dependencies
        run: pip install -r mcp-server/requirements.txt pytest
      - name: Run mandatory authority lifecycle rehearsal
        run: python -m pytest -vv -o faulthandler_timeout=180 mcp-server/tests/test_authority_rehearsal.py

  research-workspace-rehearsal:
    name: Research workspace PostgreSQL rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: research_workspace_rehearsal
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U test -d research_workspace_rehearsal"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/research_workspace_rehearsal
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/research_workspace_rehearsal
      RESEARCH_WORKSPACE_REHEARSAL_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/research_workspace_rehearsal
      SECRET_KEY: ci-research-workspace-rehearsal-secret-not-for-production
      TOKEN_ENCRYPTION_KEY: KxzLuxmIM2dFDWQmKJL9LVUK5ouA0c3_-4VqCMrn-jY=
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Apply populated pre-146 baseline online
        working-directory: backend
        run: alembic upgrade 145_mediation_confidentiality
      - name: Seed representative pre-146 data
        run: python scripts/seed_research_workspace_pre146.py
      - name: Upgrade populated baseline to head online
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migration rerun is idempotent
        working-directory: backend
        run: alembic upgrade head
      - name: Rehearse workspace integrity matrix
        run: python scripts/rehearse_research_workspace.py

  configurable-workflow-rehearsal:
    name: Configurable workflow PostgreSQL rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: configurable_workflow_rehearsal
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U test -d configurable_workflow_rehearsal"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/configurable_workflow_rehearsal
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/configurable_workflow_rehearsal
      RLS_TEST_DATABASE_URL: postgresql+asyncpg://comp09_runtime:comp09-runtime-password@127.0.0.1:5432/configurable_workflow_rehearsal
      SECRET_KEY: ci-configurable-workflow-secret-not-for-production
      TOKEN_ENCRYPTION_KEY: KxzLuxmIM2dFDWQmKJL9LVUK5ouA0c3_-4VqCMrn-jY=
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Apply the prior migration head
        working-directory: backend
        run: alembic upgrade 147_studio_drafts
      - name: Seed a pre-COMP-09 Administrator capability fixture
        env:
          PGPASSWORD: test
        run: |
          psql -h 127.0.0.1 -U test -d configurable_workflow_rehearsal -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants (id, name, domain)
          VALUES ('00000000-0000-4000-8000-000000000901', 'COMP-09 upgrade fixture', 'comp09-upgrade.invalid');
          INSERT INTO roles (id, tenant_id, name, capabilities, is_system)
          VALUES (
            '00000000-0000-4000-8000-000000000902',
            '00000000-0000-4000-8000-000000000901',
            'Administrator',
            '["manage_users"]'::jsonb,
            true
          );
          SQL
      - name: Upgrade through COMP-09 and verify rerun safety
        working-directory: backend
        run: |
          alembic upgrade head
          alembic upgrade head
      - name: Provision a production-shaped runtime role
        env:
          PGPASSWORD: test
        run: |
          psql -h 127.0.0.1 -U test -d configurable_workflow_rehearsal -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE comp09_runtime LOGIN PASSWORD 'comp09-runtime-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE configurable_workflow_rehearsal TO comp09_runtime;
          GRANT USAGE ON SCHEMA public TO comp09_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO comp09_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO comp09_runtime;
          SQL
      - name: Rehearse tenant isolation, integrity, immutability, and concurrency
        run: python scripts/rehearse_configurable_workflows.py

  # ─── Backend: Tests ─────────────────────────────────────────────────────────
  test-backend:
    name: Backend — Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: legalapp_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U test -d legalapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # Database
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/legalapp_test
      RLS_TEST_DATABASE_URL: postgresql+asyncpg://clarity_app:clarity-ci-runtime-password@localhost:5432/legalapp_test

      # Redis
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/15

      # Auth
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      TOKEN_ENCRYPTION_KEY: KxzLuxmIM2dFDWQmKJL9LVUK5ouA0c3_-4VqCMrn-jY=
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440

      # OAuth (fake keys — OAuth flows are mocked in tests)
      MICROSOFT_CLIENT_ID: fake-ms-client-id
      MICROSOFT_CLIENT_SECRET: fake-ms-client-secret
      MICROSOFT_TENANT_ID: common
      GOOGLE_CLIENT_ID: fake-google-client-id
      GOOGLE_CLIENT_SECRET: fake-google-client-secret

      # LLM APIs (fake — LLM calls are mocked in tests)
      OPENAI_API_KEY: sk-test-00000000000000000000000000000000
      DEEPSEEK_API_KEY: fake-deepseek-key
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
      ANTHROPIC_API_KEY: sk-ant-test-00000000000000000000000000000000

      # Stripe (fake — Stripe calls are mocked in tests)
      STRIPE_SECRET_KEY: sk_test_00000000000000000000000000000000
      STRIPE_WEBHOOK_SECRET: whsec_test_00000000000000000000000000000000

      # App config
      FRONTEND_URL: http://localhost:3000
      UPLOAD_DIR: /tmp/legalapp_test_uploads
      MAX_FILE_SIZE_MB: 50
      PRIMARY_LLM: deepseek-chat
      PREMIUM_LLM: claude-opus-4-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1 (Node.js 24)
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3 (Node.js 24)
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest-cov==7.1.0 diff-cover==10.5.1

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Provision least-privilege runtime role for RLS tests
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d legalapp_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE clarity_app LOGIN PASSWORD 'clarity-ci-runtime-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE legalapp_test TO clarity_app;
          GRANT USAGE ON SCHEMA public TO clarity_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO clarity_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO clarity_app;
          SQL

      - name: Run tests
        working-directory: backend
        run: >-
          pytest tests/ -v --tb=short --maxfail=1
          --cov=app --cov-report=term --cov-report=xml:coverage.xml

      - name: Require changed backend lines to remain tested
        working-directory: backend
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          diff-cover coverage.xml --compare-branch="$base" --fail-under=80

      - name: Upload backend coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node.js 24)
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  search-node-opensearch-contract:
    name: Search Node — real OpenSearch contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.3@sha256:acc1f30665727eb5d186fd15f40079615e1c9a0ee9fd3db3a8180f41d9982f51
        env:
          discovery.type: single-node
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: LawHand-CI-OpenSearch-2026!
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl --fail --silent --insecure --user admin:LawHand-CI-OpenSearch-2026! https://127.0.0.1:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 9200:9200
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1 (Node.js 24)
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3 (Node.js 24)
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Install agent test dependencies
        run: pip install -e "agent[dev]"
      - name: Export the pinned node CA certificate
        run: >-
          docker cp
          "${{ job.services.opensearch.id }}:/usr/share/opensearch/config/root-ca.pem"
          "$RUNNER_TEMP/opensearch-root-ca.pem"
      - name: Run required real-node contract
        env:
          LAWHAND_TEST_OPENSEARCH_URL: https://127.0.0.1:9200
          LAWHAND_TEST_OPENSEARCH_CA_PATH: ${{ runner.temp }}/opensearch-root-ca.pem
          LAWHAND_TEST_OPENSEARCH_USERNAME: admin
          LAWHAND_TEST_OPENSEARCH_PASSWORD: LawHand-CI-OpenSearch-2026!
        run: python -m pytest -q agent/tests/test_opensearch_integration.py

  # ─── Frontend: Build validation ─────────────────────────────────────────────
  lint-frontend:
    name: Frontend — Build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1 (Node.js 24)

      - name: Set up Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0 (Node.js 24)
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate in-product platform documentation
        working-directory: frontend
        run: node ../scripts/check_platform_docs.mjs

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend (validates TypeScript + Vite bundle)
        working-directory: frontend
        run: npm run build

      - name: Verify frontend image delivery and stale-volume rejection
        run: sh scripts/test_frontend_image_delivery.sh

      - name: Verify nginx webhook ingress and API security headers
        run: sh scripts/test_nginx_webhook_ingress.sh

  test-office-addin:
    name: Office add-in - Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1 (Node.js 24)

      - name: Set up Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0 (Node.js 24)
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: office-addin/package-lock.json

      - name: Install Office add-in dependencies
        working-directory: office-addin
        run: npm ci

      - name: Test, typecheck, and build Office add-in
        working-directory: office-addin
        run: npm run check

      - name: Verify production Office image delivery
        run: sh scripts/test_office_image_delivery.sh

  # Real-browser proof of the sold first-customer workflow. Unlike the Vitest
  # suite, this launches the actual Vite and FastAPI processes and persists the
  # intake/task records in a disposable PostgreSQL service database.
  e2e-first-customer:
    name: First customer - browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: legalapp_e2e
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U test -d legalapp_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://clarity_e2e:clarity-e2e-runtime-password@127.0.0.1:5432/legalapp_e2e
      E2E_ADMIN_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/legalapp_e2e
      REDIS_URL: redis://127.0.0.1:6379/14
      SECRET_KEY: ci-e2e-secret-key-not-for-production
      TOKEN_ENCRYPTION_KEY: KxzLuxmIM2dFDWQmKJL9LVUK5ouA0c3_-4VqCMrn-jY=
      DEV_MODE: "true"
      E2E_TEST: "true"
      PUBLIC_SIGNUP_ENABLED: "false"
      RUN_SCHEDULER: "false"
      LITELLM_ENABLED: "false"
      EMAIL_ENABLED: "false"
      CLOUD_SEARCH_ENABLED: "false"
      CORRESPONDENCE_CAPTURE_ENABLED: "false"
      FRONTEND_URL: http://127.0.0.1:3000
      BACKEND_URL: http://127.0.0.1:8000
      UPLOAD_DIR: /tmp/legalapp_e2e_uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1 (Node.js 24)

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3 (Node.js 24)
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Migrate with the disposable database owner
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/legalapp_e2e
        run: alembic upgrade head

      - name: Provision least-privilege E2E runtime role
        env:
          PGPASSWORD: test
        run: |
          psql -h 127.0.0.1 -U test -d legalapp_e2e -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE clarity_e2e LOGIN PASSWORD 'clarity-e2e-runtime-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE legalapp_e2e TO clarity_e2e;
          GRANT USAGE ON SCHEMA public TO clarity_e2e;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO clarity_e2e;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO clarity_e2e;
          SQL

      - name: Set up Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0 (Node.js 24)
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # `--with-deps` reported every shared library Chromium needs as "already
      # the newest version" — ubuntu-24.04 ships all of them.  The only thing it
      # actually fetched was 21 MB of CJK, Cyrillic and Thai font packages this
      # suite never renders, and the Azure mirror serves those at 30-60 kB/s:
      # three of them alone burned the whole budget while the index fetch just
      # before ran at 8 MB/s.  So skip apt and take the browser from Playwright's
      # own CDN.  The launch check is the safety net: if a runner image ever does
      # drop a library, it fails here with the missing name instead of surfacing
      # as an unexplained timeout inside a test.
      - name: Install Chromium
        working-directory: frontend
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ -z "$(find "$HOME/.cache/ms-playwright" -maxdepth 1 -type d -name 'chromium*' 2>/dev/null)" ]; then
            npx playwright install chromium
          else
            echo "Playwright Chromium browser cache hit"
          fi
          node -e '
            const { chromium } = require("@playwright/test");
            chromium.launch()
              .then(async (browser) => {
                console.log("chromium launched:", browser.version());
                await browser.close();
              })
              .catch((error) => {
                console.error("chromium failed to launch:", error.message);
                process.exit(1);
              });
          '

      - name: Run first-customer browser E2E
        working-directory: frontend
        run: npm run e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node.js 24)
        with:
          name: first-customer-browser-e2e
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/playwright-report
            frontend/test-results

  pr-policy-documentation:
    name: PR policy and documentation impact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout complete pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1 (Node.js 24)
        with:
          fetch-depth: 0
      - name: Enforce PR attestations, SBOM impact, and action pinning
        run: >-
          python scripts/verify_merge_policy.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

  release-notes:
    name: Release notes and version catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release-note sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1 (Node.js 24)
      - name: Validate customer notes and repository links
        run: python scripts/generate_release_notes.py --check

  security-dependency-sbom:
    name: Security, dependency, secret, and SBOM controls
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout complete history for changed-code ratchets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1 (Node.js 24)
        with:
          fetch-depth: 0
      - name: Determine comparison base
        id: comparison
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Scan newly added lines for likely secrets
        run: >-
          python scripts/scan_changed_secrets.py
          --base "${{ steps.comparison.outputs.base }}"
          --head "$GITHUB_SHA"
      - name: Enforce changed-dependency hygiene
        run: >-
          python scripts/verify_changed_dependencies.py
          --base "${{ steps.comparison.outputs.base }}"
          --head "$GITHUB_SHA"
      - name: Verify SBOM inventory when its inputs change
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ steps.comparison.outputs.base }}...$GITHUB_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(backend/requirements\.txt|mcp-server/requirements\.txt|scripts/(requirements\.txt|tabs3_export/requirements\.txt)|(frontend|office-addin)/package\.json|agent/pyproject\.toml|litellm_config\.yaml|docker-compose.*\.yml|(backend|frontend|nginx|litellm|mcp-server)/Dockerfile)$'; then
            python scripts/generate_sbom_inventory.py
            git diff --exit-code -- sbom/sbom-inventory.json docs/SBOM_TRACKING_INVENTORY.md
          else
            echo "No SBOM-tracked source input changed."
          fi

  dependency-vulnerability-review:
    name: Dependency vulnerability review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject newly introduced high-severity vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  merge-gate:
    name: Merge Gate
    if: always()
    needs:
      - tenant-data-safety
      - lint-backend
      - test-backend
      - search-node-opensearch-contract
      - lint-frontend
      - test-office-addin
      - e2e-first-customer
      - pr-policy-documentation
      - release-notes
      - security-dependency-sbom
      - dependency-vulnerability-review
      - authority-control-plane-rehearsal
      - research-workspace-rehearsal
      - configurable-workflow-rehearsal
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all applicable quality controls
        env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Upstream results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|timed_out|action_required)"'; then
            exit 1
          fi
