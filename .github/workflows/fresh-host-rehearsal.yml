name: Fresh-host production rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        topology: [hypervisor, base-prod]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and prove a clean isolated deployment
        env:
          FRESH_HOST_TOPOLOGY: ${{ matrix.topology }}
        run: bash scripts/rehearse_fresh_host.sh
