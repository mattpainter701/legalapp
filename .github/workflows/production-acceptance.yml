name: Production acceptance

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full SHA of the deployed production release"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: law-hand-ionos-production
  cancel-in-progress: false

jobs:
  release-gate:
    name: Validate deployed release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      recorded_sha: ${{ steps.release.outputs.recorded_sha }}
    steps:
      - name: Require the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_REF" == refs/heads/main ]] || {
            echo "::error::Production acceptance must be dispatched from main, not $RELEASE_REF"
            exit 1
          }

      - name: Validate and pin release SHA
        id: release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release_sha must be a full lowercase commit SHA"
            exit 1
          }
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$main_sha" == "$RELEASE_SHA" ]] || {
            echo "::error::release_sha is not the current main commit"
            exit 1
          }
          recorded_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/production" --jq '.sha')"
          comparison_status="$(
            gh api "repos/$GITHUB_REPOSITORY/compare/$recorded_sha...$RELEASE_SHA" \
              --jq '.status'
          )"
          [[ "$comparison_status" == ahead || "$comparison_status" == identical ]] || {
            echo "::error::release_sha is not a forward update from the production tag"
            exit 1
          }
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "recorded_sha=$recorded_sha" >> "$GITHUB_OUTPUT"

      - name: Require successful CI and CodeQL for accepted release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          for workflow in ci.yml codeql.yml; do
            conclusion="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --commit "$RELEASE_SHA" \
              --event push \
              --limit 20 \
              --json conclusion \
              --jq '.[0].conclusion // ""')"
            [[ "$conclusion" == success ]] || {
              echo "::error::$workflow for $RELEASE_SHA is '$conclusion'; production was not accepted."
              exit 1
            }
          done

  production:
    name: Run acceptance on IONOS
    needs: release-gate
    runs-on: [self-hosted, Linux, X64, ionos, lawhand-prod]
    environment:
      name: ionos-production
      url: https://getlawhand.com
    timeout-minutes: 30
    steps:
      - name: Preflight root-owned acceptance entrypoint
        run: |
          set -Eeuo pipefail
          entrypoint=/usr/local/sbin/lawhand-ionos-deploy-from-github
          remediation='Operator action: install the versioned scripts/lawhand-ionos-deploy-from-github at /usr/local/sbin/lawhand-ionos-deploy-from-github as root (owner root:root, mode 0755), then rerun Production acceptance.'

          # These checks intentionally run without sudo. The file is
          # world-readable/executable at the required 0755 mode; the runner's
          # only privileged action remains the exact path-scoped entrypoint.
          if ! test -f "$entrypoint" || ! test -x "$entrypoint"; then
            echo "::error title=Acceptance entrypoint unavailable::$entrypoint is missing or not executable. $remediation"
            exit 1
          fi

          # The runner may inspect this fixed, root-owned script, but never
          # reads the production checkout or environment. This catches the
          # pre-acceptance failure mode where the host still has the older
          # verify/deploy-only entrypoint.
          if ! stat -c '%U:%G %a' "$entrypoint" | grep -Fqx 'root:root 755'; then
            metadata="$(stat -c '%U:%G %a' "$entrypoint")"
            echo "::error title=Acceptance entrypoint permissions::$entrypoint has unsafe ownership or mode ($metadata). $remediation"
            exit 1
          fi

          if ! grep -Fqx '  verify|stage|deploy|accept) ;;' "$entrypoint"; then
            echo "::error title=Acceptance operation unavailable::$entrypoint does not advertise the accept operation. $remediation"
            exit 1
          fi

      - name: Run read-only host and public acceptance gate
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
        run: |
          sudo -n /usr/local/sbin/lawhand-ionos-deploy-from-github accept "$RELEASE_SHA"

      - name: Record acceptance summary
        if: always()
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
        run: |
          {
            echo "## LawHand production acceptance"
            echo
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Site: https://getlawhand.com"
            echo "- Gate: strict host production check plus public health/readiness/version checks"
          } >> "$GITHUB_STEP_SUMMARY"

  record-release:
    name: Advance production release marker
    needs: [release-gate, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move the production tag after successful acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          RECORDED_SHA: ${{ needs.release-gate.outputs.recorded_sha }}
        run: |
          set -Eeuo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$main_sha" == "$RELEASE_SHA" ]] || {
            echo "::error::main moved during acceptance; production tag was not changed"
            exit 1
          }
          current_recorded_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/production" --jq '.sha'
          )"
          [[ "$current_recorded_sha" == "$RECORDED_SHA" ]] || {
            echo "::error::production tag moved during acceptance; refusing to overwrite it"
            exit 1
          }
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/production" \
            -f sha="$RELEASE_SHA" \
            -F force=true >/dev/null
          recorded_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/production" --jq '.sha'
          )"
          [[ "$recorded_sha" == "$RELEASE_SHA" ]]
          echo "Production release marker advanced to $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
