# =============================================================================
# File Share Agent — build and publish installers
# =============================================================================
# Produces the artifacts customers actually install on a file server:
#
#   lawhand-agent-<version>-x64.msi          Windows installer (registers the
#                                            service; pairing is a separate step)
#   lawhand-agent.exe                        standalone Windows binary
#   lawhand-agent-<version>-linux-x86_64.tar.gz  Linux binary + systemd installer
#
# Runs on every change to agent/ so a broken build is caught in the PR, and
# publishes a GitHub release when an `agent-v*` tag is pushed.
# =============================================================================

name: Agent release

permissions:
  contents: read

concurrency:
  group: agent-release-${{ github.event_name }}-${{ github.ref }}
  # A newer PR commit supersedes its build. Never cancel main/tag release runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    # No path filter here: a tag push carries whatever files the tagged commit
    # changed, so filtering would skip the release build itself.
    branches: [main]
    tags: ["agent-v*"]
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "search-node/**"
      - ".github/workflows/agent-release.yml"
  workflow_dispatch:

jobs:
  windows:
    name: Windows — unsigned validation
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3 (Node.js 24)
        with:
          python-version: "3.11"

      - name: Install agent with test extras
        run: python -m pip install "./agent[dev]" "./search-node"

      - name: Run agent tests on Windows
        run: python -m pytest agent/tests -q

      - name: Build unsigned validation installers
        shell: pwsh
        run: ./agent/packaging/windows/build.ps1

      - name: Verify packaged search runtime boundary
        run: python agent/packaging/test_search_preflight.py agent/dist/lawhand-agent.exe

      - name: Smoke-test unsigned validation MSI overtop upgrade
        shell: pwsh
        run: ./agent/packaging/windows/test-upgrade.ps1 -Run

      - name: Upload unsigned executable handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node.js 24)
        with:
          name: lawhand-agent-windows-unsigned
          path: |
            agent/dist/lawhand-agent.exe
            agent/dist/lawhand-file-opener.exe
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  windows-sign:
    name: Windows — sign and package release
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: windows
    runs-on: windows-latest
    environment:
      name: agent-release
      deployment: false
      # Federated credential subject (exact; no preview wildcard):
      # repo:mattpainter701/legalapp:environment:agent-release
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3 (Node.js 24)
        with:
          python-version: "3.11"

      - name: Download unsigned executable handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lawhand-agent-windows-unsigned
          path: agent/dist

      - name: Require Azure release signing configuration
        env:
          WINDOWS_SIGNING_AZURE_CLIENT_ID: ${{ vars.WINDOWS_SIGNING_AZURE_CLIENT_ID }}
          WINDOWS_SIGNING_AZURE_TENANT_ID: ${{ vars.WINDOWS_SIGNING_AZURE_TENANT_ID }}
          WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID: ${{ vars.WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID }}
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT_NAME: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
          WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ vars.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
        shell: pwsh
        run: |
          $required = @('WINDOWS_SIGNING_AZURE_CLIENT_ID','WINDOWS_SIGNING_AZURE_TENANT_ID','WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID','WINDOWS_SIGNING_ENDPOINT','WINDOWS_SIGNING_ACCOUNT_NAME','WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME','WINDOWS_SIGNING_EXPECTED_SUBJECT')
          foreach ($name in $required) { if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Release signing configuration variable $name is missing." } }

      - name: Azure OIDC login for release signing
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.WINDOWS_SIGNING_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.WINDOWS_SIGNING_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executables with Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\agent\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed executables and build MSI
        env:
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ vars.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
        shell: pwsh
        run: |
          $executables = @('lawhand-agent.exe', 'lawhand-file-opener.exe') | ForEach-Object { Join-Path $PWD "agent/dist/$_" }
          foreach ($exe in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $exe
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate -or $signature.SignerCertificate.Subject -ne $env:WINDOWS_SIGNING_EXPECTED_SUBJECT) { throw "Authenticode verification failed for signed executable $exe." }
            & signtool verify /pa /all /tw $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool verification failed for signed executable $exe." }
          }
          ./agent/packaging/windows/build.ps1 -SkipExe

      - name: Sign Windows MSI with Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\agent\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed Windows artifacts
        env:
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ vars.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
        shell: pwsh
        run: |
          $artifacts = @((Get-ChildItem -LiteralPath (Join-Path $PWD 'agent/dist') -Filter '*.exe' -File | Select-Object -ExpandProperty FullName), (Get-ChildItem -LiteralPath (Join-Path $PWD 'agent/dist') -Filter '*.msi' -File | Select-Object -ExpandProperty FullName))
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate -or $signature.SignerCertificate.Subject -ne $env:WINDOWS_SIGNING_EXPECTED_SUBJECT) { throw "Unexpected or invalid Windows signer for $artifact." }
            & signtool verify /pa /all /tw $artifact
            if ($LASTEXITCODE -ne 0) { throw "signtool verification failed for $artifact" }
          }

      - name: Smoke-test signed MSI overtop upgrade
        env:
          WINDOWS_SIGNING_EXPECTED_SUBJECT: ${{ vars.WINDOWS_SIGNING_EXPECTED_SUBJECT }}
        shell: pwsh
        run: ./agent/packaging/windows/test-upgrade.ps1 -Run -ExpectedSignerSubject $env:WINDOWS_SIGNING_EXPECTED_SUBJECT

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node.js 24)
        with:
          name: lawhand-agent-windows
          path: |
            agent/dist/lawhand-agent.exe
            agent/dist/lawhand-file-opener.exe
            agent/dist/*.msi
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  linux:
    name: Linux — binary and tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3 (Node.js 24)
        with:
          python-version: "3.11"

      - name: Install agent with test extras
        run: python -m pip install "./agent[dev]" "./search-node"

      - name: Run agent tests
        run: python -m pytest agent/tests -q

      - name: Validate Linux installer scripts
        run: bash -n agent/packaging/linux/build.sh agent/packaging/linux/install.sh agent/packaging/linux/lawhand-agent-update

      - name: Build agent binary
        run: ./agent/packaging/linux/build.sh

      - name: Verify packaged search runtime boundary
        run: python agent/packaging/test_search_preflight.py agent/dist/lawhand-agent

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node.js 24)
        with:
          name: lawhand-agent-linux
          path: |
            agent/dist/lawhand-agent
            agent/dist/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  publish-release:
    name: Publish verified release
    needs: [windows-sign, linux]
    if: startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node.js 24)
        with:
          name: lawhand-agent-windows
          path: release/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node.js 24)
        with:
          name: lawhand-agent-linux
          path: release/linux

      - name: Validate tag and prepare stable aliases
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' agent/clarity_agent/__init__.py)"
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' agent/pyproject.toml | head -n 1)"
          test "$package_version" = "$version" || {
            echo "Agent package version $package_version does not match runtime version $version" >&2
            exit 1
          }
          test "$TAG" = "agent-v$version" || {
            echo "Tag $TAG does not match agent version $version" >&2
            exit 1
          }
          mkdir -p release/assets
          cp release/windows/lawhand-agent.exe release/assets/
          cp release/windows/*-x64.msi release/assets/
          cp release/linux/lawhand-agent release/assets/
          cp release/linux/*-linux-*.tar.gz release/assets/
          cp release/windows/*-x64.msi release/assets/lawhand-agent-x64.msi
          cp release/linux/*-linux-*.tar.gz release/assets/lawhand-agent-linux-x86_64.tar.gz
          windows_sha256="$(sha256sum release/assets/lawhand-agent-x64.msi | awk '{print $1}')"
          linux_sha256="$(sha256sum release/assets/lawhand-agent-linux-x86_64.tar.gz | awk '{print $1}')"
          printf '{"schema_version":1,"version":"%s","assets":{"windows-x86_64":{"name":"lawhand-agent-x64.msi","sha256":"%s"},"linux-x86_64":{"name":"lawhand-agent-linux-x86_64.tar.gz","sha256":"%s"}}}\n' \
            "$version" "$windows_sha256" "$linux_sha256" > release/assets/agent-update.json
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path("release/assets")
          version = re.search(r'__version__\s*=\s*"([^"]+)"', pathlib.Path("agent/clarity_agent/__init__.py").read_text()).group(1)
          manifest = json.loads((root / "agent-update.json").read_text())
          assert manifest["schema_version"] == 1 and manifest["version"] == version
          for key, name in {
              "windows-x86_64": "lawhand-agent-x64.msi",
              "linux-x86_64": "lawhand-agent-linux-x86_64.tar.gz",
          }.items():
              entry = manifest["assets"][key]
              assert entry == {"name": name, "sha256": hashlib.sha256((root / name).read_bytes()).hexdigest()}
          PY
          (cd release/assets && sha256sum * > SHA256SUMS.txt)
          test -s release/assets/lawhand-agent-x64.msi
          test -s release/assets/lawhand-agent-linux-x86_64.tar.gz
          test -s release/assets/agent-update.json

      - name: Publish only after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          verify_required_assets() {
            local assets required
            assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for required in \
              lawhand-agent-x64.msi \
              lawhand-agent-linux-x86_64.tar.gz \
              agent-update.json \
              SHA256SUMS.txt; do
              if ! grep -Fxq "$required" <<<"$assets"; then
                echo "Release $TAG is missing required asset: $required" >&2
                echo "Available assets:" >&2
                printf '%s\n' "$assets" >&2
                return 1
              fi
            done
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if test "$is_draft" != "true"; then
              verify_required_assets
              echo "Release $TAG is already published; leaving immutable assets unchanged."
              exit 0
            fi
          else
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --title "File Share Agent ${TAG#agent-}" \
              --notes "Windows MSI/EXE and Linux binary for the on-premise file share agent. See agent/README.md for install and pairing steps. Verify downloads with SHA256SUMS.txt and agent-update.json."
          fi
          gh release upload "$TAG" release/assets/* --clobber
          verify_required_assets
          gh release edit "$TAG" --draft=false --latest

      - name: Verify public stable downloads
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$REPOSITORY/releases/latest/download"
          for asset in lawhand-agent-x64.msi lawhand-agent-linux-x86_64.tar.gz agent-update.json SHA256SUMS.txt; do
            curl --fail --location --retry 5 --retry-all-errors \
              --range 0-0 --output /dev/null "$base/$asset"
          done
