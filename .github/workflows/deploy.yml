# IONOS is production. This legacy filename remains for operator bookmarks, but
# it can only verify the retired Skynet runner and cannot start application
# writers or move the production tag.
name: Verify retired Skynet production runner

run-name: Verify retired Skynet runner @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: law-hand-skynet-runner-verify
  cancel-in-progress: true

jobs:
  release-gate:
    name: Pin current main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_REF" == refs/heads/main ]] || {
            echo "::error::Runner verification must be dispatched from main"
            exit 1
          }

      - name: Pin the exact commit
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  skynet-runner:
    name: Verify retired Skynet runner
    needs: release-gate
    runs-on: [self-hosted, linux, x64, skynet, lawhand-prod]
    timeout-minutes: 10
    steps:
      - name: Call verification-only host entrypoint
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
        run: sudo -n /usr/local/sbin/lawhand-deploy-from-github verify "$RELEASE_SHA"

      - name: Record summary
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
        run: |
          {
            echo "## Retired Skynet production runner"
            echo
            echo "- Verification commit: \`$RELEASE_SHA\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- No deployment or release-marker mutation is available."
          } >> "$GITHUB_STEP_SUMMARY"
