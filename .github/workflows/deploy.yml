# Operator-triggered production deployment. Pushes to main never mutate
# production automatically; run this only after CI and release gates pass.
#
# Required repository secrets (Settings → Secrets → Actions):
#   VPS_HOST        — IP or hostname of the production VPS
#   VPS_USER        — SSH user (e.g. deploy)
#   VPS_SSH_KEY     — Private SSH key (corresponding public key must be in ~/.ssh/authorized_keys on VPS)
#   VPS_KNOWN_HOSTS — Pre-verified known_hosts line for the production SSH host
#   VPS_APP_DIR     — Absolute path to the app on VPS (e.g. /home/deploy/legalapp)
#   PRODUCTION_ORIGIN — Canonical HTTPS origin, e.g. https://legal.example.com
#   SLACK_WEBHOOK_URL — (optional) Slack incoming webhook for deploy notifications

name: Deploy to Production

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: false
        default: '--build'
        type: choice
        options: ['--build', '--pull']

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-progress deploy

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Pin exact release commit
        id: release
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          conclusion="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$RELEASE_SHA" \
              -f branch=main \
              -f event=push \
              -f per_page=20 \
              --jq '.workflow_runs | sort_by(.run_number) | last | .conclusion // ""'
          )"
          if [[ "$conclusion" != success ]]; then
            echo "::error::CI has not succeeded for release commit $RELEASE_SHA (conclusion=${conclusion:-missing})."
            exit 1
          fi

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add pinned VPS host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          BUILD_MODE: ${{ github.event.inputs.build_mode || '--build' }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          ssh $VPS_USER@$VPS_HOST "
            set -e
            cd $VPS_APP_DIR
            echo '==> Fetching pinned release commit $RELEASE_SHA'
            git fetch origin main
            git cat-file -e '$RELEASE_SHA^{commit}'
            git merge-base --is-ancestor '$RELEASE_SHA' origin/main
            git reset --hard '$RELEASE_SHA'
            test \"\$(git rev-parse HEAD)\" = '$RELEASE_SHA'
            echo '==> Commit: $RELEASE_SHA'
            echo '==> Running deploy script'
            bash scripts/deploy_prod.sh $BUILD_MODE
          "

      - name: Health check
        env:
          PRODUCTION_ORIGIN: ${{ secrets.PRODUCTION_ORIGIN }}
        run: |
          test -n "$PRODUCTION_ORIGIN"
          STATUS=$(curl -sf --retry 12 --retry-all-errors --retry-delay 5 --max-time 10 "$PRODUCTION_ORIGIN/health/readiness" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "unreachable")
          echo "Health: $STATUS"
          if [ "$STATUS" != "ok" ]; then
            echo "::error::Health check failed — status=$STATUS"
            exit 1
          fi

      - name: Notify Slack (success)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"✅ Clarity Legal deployed successfully — <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|$(git log --oneline -1 --format='%s')>\"}"

      - name: Notify Slack (failure)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"❌ Clarity Legal deploy FAILED — check <https://github.com/${{ github.repository }}/actions|Actions>\"}"
