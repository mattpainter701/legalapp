# Production changes are intentionally operator-triggered. CI stays on
# GitHub-hosted runners; only this deployment job can target Skynet.
name: Deploy to Production

run-name: ${{ inputs.operation == 'deploy' && 'Deploy' || 'Verify' }} main @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Verify the runner or deploy the selected main commit"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy

permissions:
  actions: read
  contents: read

concurrency:
  group: law-hand-production
  cancel-in-progress: false

jobs:
  release-gate:
    name: Validate production release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Require the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != refs/heads/main ]]; then
            echo "::error::Production runs must be dispatched from main, not $RELEASE_REF"
            exit 1
          fi

      - name: Pin the exact release commit
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for exact release commit
        if: inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          head_sha="$RELEASE_SHA"
          conclusion="$({
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$head_sha" \
              --event push \
              --limit 20 \
              --json conclusion \
              --jq '.[0].conclusion // ""'
          } 2>/dev/null)"
          if [[ "$conclusion" != success ]]; then
            echo "::error::CI for $head_sha is '$conclusion'; production was not changed."
            exit 1
          fi

  production:
    name: ${{ inputs.operation == 'deploy' && 'Deploy on Skynet' || 'Verify Skynet runner' }}
    needs: release-gate
    runs-on: [self-hosted, linux, x64, skynet, lawhand-prod]
    environment:
      name: production
      url: https://getlawhand.com
    timeout-minutes: 45
    steps:
      # Deliberately do not check out repository code on the production runner.
      # The root-owned entrypoint fetches origin/main and accepts only this SHA.
      - name: Run the pinned host deployment entrypoint
        env:
          DEPLOY_OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
        run: |
          sudo -n /usr/local/sbin/lawhand-deploy-from-github \
            "$DEPLOY_OPERATION" "$RELEASE_SHA"

      - name: Record deployment summary
        if: always()
        env:
          DEPLOY_OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
        run: |
          {
            echo "## LawHand production"
            echo
            echo "- Operation: \`$DEPLOY_OPERATION\`"
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Site: https://getlawhand.com"
          } >> "$GITHUB_STEP_SUMMARY"

  record-release:
    name: Advance production release marker
    if: inputs.operation == 'deploy'
    needs: [release-gate, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move the production tag to the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
        run: |
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/production" \
            -f sha="$RELEASE_SHA" \
            -F force=true >/dev/null
          recorded_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/production" \
              --jq '.object.sha'
          )"
          [[ "$recorded_sha" == "$RELEASE_SHA" ]]
          echo "Production release marker advanced to $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
