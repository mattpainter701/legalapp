# =============================================================================
# Dependabot auto-merge
# =============================================================================
# Automatically approve and enable auto-merge for Dependabot PRs that pass CI.
# Only patches and minor versions are auto-merged; major bumps require manual
# review.  The PR must still pass every required status check before GitHub
# actually merges it.
#
# Dependabot PRs do not inherit the PR body template, so they fail the
# merge-policy gate (PR attestations, SBOM staleness).  Those checks are
# already exempted for Dependabot in verify_merge_policy.py and ci.yml.
# =============================================================================

name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Approve and enable auto-merge
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444e2571f86 # v2.4.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve the PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patches and minors
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip auto-merge for major version bumps
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "Major version bump detected — skipping auto-merge."
          echo "Please review and merge manually."
