name: Production public health

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-public-health
  cancel-in-progress: true

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_ORIGIN: https://getlawhand.com
      PRODUCTION_DOMAIN: getlawhand.com
    steps:
      - name: Verify API and frontend
        id: http
        continue-on-error: true
        run: |
          require_single_hsts() {
            local url="$1" headers count value
            headers="$(curl --fail --silent --show-error --max-time 20 --dump-header - --output /dev/null "$url" | tr -d '\r')"
            count="$(printf '%s\n' "$headers" | awk 'tolower($0) ~ /^strict-transport-security:/ { count++ } END { print count + 0 }')"
            value="$(printf '%s\n' "$headers" | awk 'tolower($0) ~ /^strict-transport-security:/ { sub(/^[^:]*:[[:space:]]*/, ""); print }')"
            [[ "$count" == "1" ]]
            printf '%s' "$value" \
              | grep -Eiq '^max-age=63072000;[[:space:]]*includeSubDomains([[:space:]]*;[[:space:]]*preload)?[[:space:]]*$'
          }

          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_ORIGIN/health/readiness" | tee /tmp/readiness.json | grep -q '"status":"ok"'
          grep -q '"host_disks":"ok"' /tmp/readiness.json
          grep -q '"backups":"ok"' /tmp/readiness.json
          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_ORIGIN/" >/dev/null
          for disabled_mcp_path in /api/mcp /api/mcp/manifest; do
            disabled_mcp_status="$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "$PRODUCTION_ORIGIN$disabled_mcp_path")"
            [[ "$disabled_mcp_status" == "404" ]]
          done
          require_single_hsts "$PRODUCTION_ORIGIN/"
          require_single_hsts "$PRODUCTION_ORIGIN/api/version"

          http_api_headers="$(curl --silent --show-error --max-time 20 --dump-header - --output /dev/null "http://$PRODUCTION_DOMAIN/api/version" | tr -d '\r')"
          http_api_status="$(printf '%s\n' "$http_api_headers" | awk 'toupper($1) ~ /^HTTP\// { status=$2 } END { print status }')"
          http_api_location_count="$(printf '%s\n' "$http_api_headers" | awk 'tolower($0) ~ /^location:/ { count++ } END { print count + 0 }')"
          http_api_location="$(printf '%s\n' "$http_api_headers" | awk 'tolower($0) ~ /^location:/ { sub(/^[^:]*:[[:space:]]*/, ""); print }')"
          http_api_hsts_count="$(printf '%s\n' "$http_api_headers" | awk 'tolower($0) ~ /^strict-transport-security:/ { count++ } END { print count + 0 }')"
          [[ "$http_api_status" == "301" ]]
          [[ "$http_api_location_count" == "1" ]]
          [[ "$http_api_location" == "$PRODUCTION_ORIGIN/api/version" ]]
          [[ "$http_api_hsts_count" == "0" ]]

      - name: Verify TLS remains valid for 14 days
        id: tls
        continue-on-error: true
        run: |
          timeout 20 openssl s_client -connect "$PRODUCTION_DOMAIN:443" -servername "$PRODUCTION_DOMAIN" </dev/null 2>/dev/null \
            | openssl x509 -checkend 1209600 -noout

      - name: Create, update, or resolve production alert
        id: reconcile
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8 (Node.js 24)
        env:
          HTTP_OUTCOME: ${{ steps.http.outcome }}
          TLS_OUTCOME: ${{ steps.tls.outcome }}
        with:
          script: |
            const title = '[production-alert] LawHand readiness failure';
            const failed = process.env.HTTP_OUTCOME !== 'success' || process.env.TLS_OUTCOME !== 'success';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (failed) {
              const body = [
                'The scheduled production gate detected an unhealthy signal.',
                '',
                `- Readiness/HTTP: ${process.env.HTTP_OUTCOME}`,
                `- TLS (14-day floor): ${process.env.TLS_OUTCOME}`,
                `- Run: ${runUrl}`,
                '',
                'The public readiness endpoint reports only component states; inspect production logs and run `scripts/production_check.sh` for operator detail.',
              ].join('\n');
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
                core.setOutput('transition', 'ongoing-failure');
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
                core.setOutput('transition', 'new-failure');
              }
              core.setFailed('Production readiness or TLS check failed.');
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Production recovered. Successful run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
              core.setOutput('transition', 'recovered');
            } else {
              core.setOutput('transition', 'healthy');
            }

      - name: Send optional transition webhook
        if: ${{ always() && (steps.reconcile.outputs.transition == 'new-failure' || steps.reconcile.outputs.transition == 'recovered') }}
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_TRANSITION: ${{ steps.reconcile.outputs.transition }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "No optional alert webhook configured; GitHub issue delivery remains active."
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -n --arg text "LawHand production health: ${ALERT_TRANSITION}. ${run_url}" '{text: $text}')"
          curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' --data "$payload" "$ALERT_WEBHOOK_URL" \
            || echo "::warning::Optional production alert webhook delivery failed."
