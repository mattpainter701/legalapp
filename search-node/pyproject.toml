[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawhand-search-node"
version = "0.1.0"
description = "Isolated document extraction and OCR workers for LawHand Firm Memory"
requires-python = ">=3.11"
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
lawhand-search-extract = "search_node.cli:extract_main"
lawhand-search-ocr = "search_node.cli:ocr_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
search_node = ["tika-config.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
