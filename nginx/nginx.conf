# =============================================================================
# Clarity Legal — Production Nginx Configuration
# =============================================================================
# TLS termination, HTTP→HTTPS redirect, security headers, gzip, rate limiting,
# WebSocket support, and static asset caching.
#
# Cert paths (both dev self-signed and Let's Encrypt use the same paths):
#   /etc/nginx/ssl/fullchain.pem
#   /etc/nginx/ssl/privkey.pem
#
# For local dev: run  bash nginx/generate-self-signed.sh
# For production: run  bash nginx/init-letsencrypt.sh <domain> <email>
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ─────────────────────────────────────────────────────
    # Logging
    # ─────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─────────────────────────────────────────────────────
    # Gzip compression
    # ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # ─────────────────────────────────────────────────────
    # Rate limiting zones (IP-based, defined at http level)
    # ─────────────────────────────────────────────────────
    # General API: 60 requests/minute per IP, 10 MB zone (~160 000 IPs)
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # Auth endpoints: 10 requests/minute per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Return 429 (Too Many Requests) instead of default 503 on rate limit
    limit_req_status 429;

    # ─────────────────────────────────────────────────────
    # Upstream services
    # ─────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ─────────────────────────────────────────────────────
    # HTTP → HTTPS redirect (port 80)
    # ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow Certbot ACME challenges through (webroot mode)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────────────
    # HTTPS — main server (port 443)
    # ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ── SSL/TLS certificates ────────────────────────
        # Both generate-self-signed.sh (dev) and init-letsencrypt.sh (prod)
        # write certs to these paths via the nginx/ssl/ volume mount.
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # ── TLS hardening ───────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling (no-op with self-signed; active with Let's Encrypt)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ── Body size ───────────────────────────────────
        client_max_body_size 50M;

        # ── Security headers ────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https:; frame-ancestors 'self';" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Stripe billing webhook ───────────────────────
        # Stripe can take up to 30 s to send a webhook; give it room.
        location /api/billing/webhook {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout    30s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
        }

        # ── Auth endpoints (stricter rate limit) ─────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # ── General API (standard rate limit) ────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket upgrade support
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout    60s;
        }

        # ── Static assets (served directly from dist volume) ─────────────────────────
        # Fingerprinted assets (Vite appends hash to filenames) are served directly
        # from the mounted frontend_dist volume, with aggressive caching.
        location /assets/ {
            alias /usr/share/nginx/html/dist/assets/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            # Re-declare security headers so they are not stripped
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── Backend utility paths (no /api prefix) ─────────
        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        location /docs {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /openapi.json {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        location /redoc {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Frontend (SPA catch-all) ──────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket support for Vite HMR in dev; harmless in prod
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }

    # ─────────────────────────────────────────────────────
    # DEV NOTE — self-signed cert for local testing
    # ─────────────────────────────────────────────────────
    # 1. Generate cert:   bash nginx/generate-self-signed.sh
    # 2. docker compose up nginx
    # 3. Visit https://localhost — accept the browser warning.
    #
    # The volume mount in docker-compose.yml maps ./nginx/ssl → /etc/nginx/ssl
    # so the same config works for both dev and prod. The only difference is
    # whether fullchain.pem was signed by Let's Encrypt or openssl self-signed.
    # ─────────────────────────────────────────────────────
}
