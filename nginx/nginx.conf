# =============================================================================
# Clarity Legal — Cloudflare Tunnel Nginx Configuration
# =============================================================================
# Serves HTTP-only on port 80. TLS termination happens at Cloudflare edge
# (Flexible or Full mode). No local SSL certs needed.
#
# Rate limiting, security headers, gzip, WebSocket, and static asset caching
# are still applied at nginx level.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Logging ──────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # The SPA shell is returned for every client-side route. Only the public
    # marketing and legal-summary pages may be indexed before JavaScript runs.
    map $uri $x_robots_tag {
        default                         "noindex, nofollow, noarchive";
        ~^/$                            "";
        ~^/(privacy|terms)/?$           "";
        ~^/(robots\.txt|sitemap\.xml)$  "";
    }

    # Only a configured Cloudflare/cloudflared peer may assert the browser's
    # original scheme. `$realip_remote_addr` retains the connection peer even
    # after the real-IP module replaces `$remote_addr` with the public client.
    # This prevents direct clients from bypassing the HTTP redirect by spoofing
    # X-Forwarded-Proto. Private ranges are limited to the documented trusted
    # single-host cloudflared/VPC boundary.
    geo $realip_remote_addr $trusted_edge_peer {
        default 0;
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;
        172.16.0.0/12 1;
        10.0.0.0/8 1;
    }

    map "$trusted_edge_peer:$http_x_forwarded_proto" $trusted_edge_https {
        default    0;
        "1:https" 1;
    }

    # nginx suppresses an add_header whose mapped value is empty, so HSTS is
    # emitted only for an edge-authenticated HTTPS request on the HTTP listener.
    map $trusted_edge_https $edge_hsts_header {
        default "";
        1       "max-age=63072000; includeSubDomains";
    }

    # Server-level rewrite processing runs before location selection. Exempt
    # only trusted edge HTTPS and ACME HTTP-01; every other path on port 80 is
    # redirected before it can reach an API, webhook, health, asset, or SPA
    # proxy location.
    map "$trusted_edge_https:$uri" $redirect_plain_http {
        default                            1;
        ~^1:                               0;
        ~^0:/\.well-known/acme-challenge/ 0;
    }

    # ── Real IP (Cloudflare) ─────────────────────────────
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # cloudflared tunnel delivers traffic from the Docker bridge network.
    # It forwards the public client in X-Forwarded-For, so the shared tunnel
    # peer must be trusted or every public user shares one rate-limit bucket.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── Gzip ─────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Rate limiting ────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m      rate=60r/m;
    limit_req_zone $binary_remote_addr zone=platform:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=10r/m;
    limit_req_zone $binary_remote_addr zone=oauth:10m rate=30r/m;
    limit_req_status 429;

    # ── Upstreams ────────────────────────────────────────
    upstream backend  { server backend:8000;  keepalive 32; }
    upstream frontend { server frontend:3000; keepalive 16; }

    # ── Main server (HTTP :80) ───────────────────────────
    # Used both behind Cloudflare (TLS terminated at edge) AND, when serving TLS
    # locally via Let's Encrypt (see init-letsencrypt.sh + the :443 block below),
    # this block also serves the ACME http-01 challenge and routes app traffic.
    server {
        listen 80;
        server_name _;

        client_max_body_size 55m;   # MAX_FILE_SIZE_MB=50 + multipart/overhead

        if ($redirect_plain_http) {
            return 301 https://$host$request_uri;
        }

        # ── ACME http-01 challenge (Let's Encrypt webroot) ──
        # Served on plain HTTP so certbot can validate before/while TLS exists.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # ── Security headers ─────────────────────────────
        add_header Strict-Transport-Security $edge_hsts_header always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; object-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        # X-XSS-Protection intentionally omitted: deprecated, removed from all
        # modern browsers, and its legacy heuristic filter had known XSS
        # bypasses of its own. Content-Security-Policy above is the real control.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag $x_robots_tag always;

        # ── Stripe billing webhook ────────────────────────
        location /api/billing/webhook {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout    30s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
        }

        # ── OAuth callbacks (looser rate limit — multiple redirects per flow) ───
        location ~ ^/api/auth/(google|microsoft)/ {
            limit_req zone=oauth burst=15 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # ── Session check / refresh (not brute-forceable — every page load and
        # post-login redirect calls /me, so the tight `auth` zone 429s real users) ──
        location = /api/auth/me {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        location = /api/auth/refresh {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # ── Auth endpoints (stricter rate limit) ─────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # ── Platform operator console (higher rate limit) ──
        location /api/platform/ {
            limit_req zone=platform burst=30 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout    60s;
        }

        # ── Zoom Phone webhooks (small signed JSON events only) ──
        # Keep both the retired shared endpoint and tenant-specific endpoint
        # below the general API upload allowance. Exact/^~ matching guarantees
        # these requests cannot fall through to the 55 MiB /api/ policy.
        location = /api/integrations/zoom-phone/webhook {
            client_max_body_size 256k;
            limit_req zone=api burst=20 nodelay;

            include /etc/nginx/snippets/api_proxy.conf;
            include /etc/nginx/snippets/sse_streaming.conf;
        }

        location ^~ /api/integrations/zoom-phone/webhook/ {
            client_max_body_size 256k;
            limit_req zone=api burst=20 nodelay;

            include /etc/nginx/snippets/api_proxy.conf;
            include /etc/nginx/snippets/sse_streaming.conf;
        }

        # ── General API ──────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            include /etc/nginx/snippets/api_proxy.conf;
            include /etc/nginx/snippets/sse_streaming.conf;
        }

        # ── Static assets — proxy to frontend container (hashed filenames) ──
        location /assets/ {
            proxy_pass http://frontend;
            add_header Strict-Transport-Security $edge_hsts_header always;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── Backend utility paths ─────────────────────────
        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        location /docs {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /openapi.json {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        location /redoc {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Frontend SPA catch-all ───────────────────────────────────────
        # The server-level gate redirects every untrusted/plain HTTP path.
        # Trusted edge HTTPS requests reach the proxy locations below; the
        # ACME exception remains served locally for certificate renewal.
        #
        # Deployment notes:
        #   Cloudflare Full(Strict) — enable "Always Use HTTPS" in the CF
        #     dashboard; CF→origin is HTTPS via the :443 block; only stray
        #     direct-HTTP origin access is redirected here.
        #   Let's Encrypt (no Cloudflare) — all plain-HTTP is redirected.
        #   Cloudflare Flexible — upgrade to Full(Strict); Flexible exposes
        #     the origin HTTP channel to interception.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }

    # =========================================================================
    # Production TLS server (:443)
    # =========================================================================
    # Active when terminating TLS locally with Let's Encrypt certs provisioned
    # by nginx/init-letsencrypt.sh (certs mounted read-only at /etc/nginx/ssl/).
    # When fronted by Cloudflare (Flexible mode) only the :80 block above is hit
    # and this block is simply never reached, so it is safe to keep enabled.
    #
    # NOTE: this block is NOT served by the dev config (nginx.dev.conf), so no
    # HSTS / TLS directives leak into local HTTP development.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ── TLS certificates (written by init-letsencrypt.sh / renew-cert.sh) ──
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # ── Modern TLS ───────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        client_max_body_size 55m;   # MAX_FILE_SIZE_MB=50 + multipart/overhead

        # ── Security headers (TLS only) ──────────────────
        # Direct TLS gets HSTS here; edge-terminated TLS is handled by the
        # proxy-aware mapped header in the HTTP server above.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Keep the application policy identical whether TLS terminates here or
        # at an upstream edge. PDF previews require blob: in object-src.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; object-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag $x_robots_tag always;

        # ── ACME http-01 renewal challenge ───────────────
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # ── Stripe billing webhook ────────────────────────
        location /api/billing/webhook {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout    30s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
        }

        # ── OAuth callbacks (looser rate limit — multiple redirects per flow) ───
        location ~ ^/api/auth/(google|microsoft)/ {
            limit_req zone=oauth burst=15 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # ── Session check / refresh (not brute-forceable — every page load and
        # post-login redirect calls /me, so the tight `auth` zone 429s real users) ──
        location = /api/auth/me {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        location = /api/auth/refresh {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # ── Auth endpoints (stricter rate limit) ─────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # ── Platform operator console (higher rate limit) ──
        location /api/platform/ {
            limit_req zone=platform burst=30 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout    300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout    60s;
        }

        # ── Zoom Phone webhooks (small signed JSON events only) ──
        # Keep both the retired shared endpoint and tenant-specific endpoint
        # below the general API upload allowance. Exact/^~ matching guarantees
        # these requests cannot fall through to the 55 MiB /api/ policy.
        location = /api/integrations/zoom-phone/webhook {
            client_max_body_size 256k;
            limit_req zone=api burst=20 nodelay;

            include /etc/nginx/snippets/api_proxy.conf;
            include /etc/nginx/snippets/sse_streaming.conf;
        }

        location ^~ /api/integrations/zoom-phone/webhook/ {
            client_max_body_size 256k;
            limit_req zone=api burst=20 nodelay;

            include /etc/nginx/snippets/api_proxy.conf;
            include /etc/nginx/snippets/sse_streaming.conf;
        }

        # ── General API ──────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            include /etc/nginx/snippets/api_proxy.conf;
            include /etc/nginx/snippets/sse_streaming.conf;
        }

        # ── Static assets — proxy to frontend container ──
        location /assets/ {
            proxy_pass http://frontend;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── Backend utility paths ─────────────────────────
        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        location /docs {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /openapi.json {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        location /redoc {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Frontend SPA catch-all ────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
