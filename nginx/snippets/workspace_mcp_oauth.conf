# OAuth discovery lives outside /api, so route only the standards-defined
# metadata paths to FastAPI instead of allowing the SPA fallback to answer.
location = /.well-known/oauth-protected-resource {
    limit_req zone=oauth burst=15 nodelay;
    include /etc/nginx/snippets/api_proxy.conf;
}

location = /.well-known/oauth-protected-resource/api/mcp/workspace {
    limit_req zone=oauth burst=15 nodelay;
    include /etc/nginx/snippets/api_proxy.conf;
}

location = /.well-known/oauth-authorization-server {
    limit_req zone=oauth burst=15 nodelay;
    include /etc/nginx/snippets/api_proxy.conf;
}

# Desktop registration, authorization, token, revocation, and JWKS payloads
# are small. Keep them out of the broad 55 MiB general API allowance.
location ^~ /api/workspace-mcp/oauth/ {
    client_max_body_size 64k;
    limit_req zone=oauth burst=15 nodelay;
    include /etc/nginx/snippets/api_proxy.conf;
}
