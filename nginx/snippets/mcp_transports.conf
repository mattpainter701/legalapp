# Exact transport locations keep MCP lifecycle traffic out of the generic API
# proxy contract while management and compatibility routes remain available
# only on the main application origin.
location = /api/mcp {
    client_max_body_size 1m;
    limit_req zone=api burst=20 nodelay;
    include /etc/nginx/snippets/mcp_transport_proxy.conf;
}

location = /api/mcp/workspace {
    client_max_body_size 1m;
    limit_req zone=api burst=20 nodelay;
    include /etc/nginx/snippets/mcp_transport_proxy.conf;
}
