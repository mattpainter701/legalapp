# Exact transport locations keep MCP lifecycle traffic out of the generic API
# proxy contract while the exact research compatibility routes receive the
# same body, connection, method, and product-specific rate controls.
location = /api/mcp {
    client_max_body_size 256k;
    client_body_timeout 15s;
    limit_req zone=mcp_research burst=20 nodelay;
    limit_conn mcp_connections 10;
    if ($request_method !~ ^(GET|POST|DELETE)$) {
        return 405;
    }
    include /etc/nginx/snippets/mcp_transport_proxy.conf;
}

location = /api/mcp/workspace {
    client_max_body_size 256k;
    client_body_timeout 15s;
    limit_req zone=mcp_workspace burst=20 nodelay;
    limit_conn mcp_connections 10;
    if ($request_method !~ ^(GET|POST|DELETE)$) {
        return 405;
    }
    include /etc/nginx/snippets/mcp_transport_proxy.conf;
}

location = /api/mcp/manifest {
    client_max_body_size 256k;
    client_body_timeout 15s;
    limit_req zone=mcp_research burst=20 nodelay;
    limit_conn mcp_connections 10;
    if ($request_method != GET) {
        return 405;
    }
    include /etc/nginx/snippets/mcp_transport_proxy.conf;
}

location = /api/mcp/tools/call {
    client_max_body_size 256k;
    client_body_timeout 15s;
    limit_req zone=mcp_research burst=20 nodelay;
    limit_conn mcp_connections 10;
    if ($request_method != POST) {
        return 405;
    }
    include /etc/nginx/snippets/mcp_transport_proxy.conf;
}
