# SSE chat streaming (/messages/stream) requires unbuffered passthrough.
# `proxy_buffering off` controls nginx's upstream response handling directly.
# Do not use `add_header` in this location-level snippet: nginx would then stop
# inheriting the production server's HSTS, CSP, and other security headers.
proxy_buffering off;
proxy_cache off;
chunked_transfer_encoding on;
