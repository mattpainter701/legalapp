# The Office task pane is intentionally isolated from the main SPA headers.
# Office on the web embeds it cross-origin, so X-Frame-Options is omitted and
# frame ancestors are limited to Microsoft 365 host families.
location = /office {
    return 302 /office/;
}

location ^~ /office/ {
    # Runtime-DNS proxy target: $upstream_office_addin is defined at http
    # scope in nginx.conf and resolved per request. A variable proxy_pass has
    # no URI-replacement part, so the explicit rewrite preserves the old
    # static-upstream mapping (/office/x forwarded upstream as /x); the
    # variable form then forwards the rewritten URI unchanged.
    rewrite ^/office/(.*)$ /$1 break;
    proxy_pass $upstream_office_addin;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.office.com https://*.office365.com https://*.live.com https://*.microsoft.com;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
