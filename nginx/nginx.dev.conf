# Dev nginx — HTTP only, no SSL certs required.
# Proxies /api/* → FastAPI backend, everything else → Vite dev server.
# Vite WebSocket (HMR) upgrade is passed through correctly.

worker_processes 1;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=oauth:10m rate=30r/m;

    upstream backend  { server backend:8000;  }
    upstream frontend { server frontend:3000; }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        include /etc/nginx/snippets/workspace_mcp_oauth.conf;

        # Zoom Phone webhooks are small signed JSON events. Exact/^~ matching
        # keeps both route forms below the general API upload allowance.
        location = /api/integrations/zoom-phone/webhook {
            client_max_body_size 256k;

            include /etc/nginx/snippets/api_proxy.conf;
            include /etc/nginx/snippets/sse_streaming.conf;
        }

        location ^~ /api/integrations/zoom-phone/webhook/ {
            client_max_body_size 256k;

            include /etc/nginx/snippets/api_proxy.conf;
            include /etc/nginx/snippets/sse_streaming.conf;
        }

        # Teams voice webhooks are small Graph change notifications. Microsoft
        # calls them unauthenticated, so both route forms stay below the general
        # API upload allowance.
        location = /api/integrations/teams/voice/webhook {
            client_max_body_size 256k;

            include /etc/nginx/snippets/api_proxy.conf;
            include /etc/nginx/snippets/sse_streaming.conf;
        }

        location ^~ /api/integrations/teams/voice/webhook/ {
            client_max_body_size 256k;

            include /etc/nginx/snippets/api_proxy.conf;
            include /etc/nginx/snippets/sse_streaming.conf;
        }

        # API — proxy directly to FastAPI
        location /api/ {
            include /etc/nginx/snippets/api_proxy.conf;
            include /etc/nginx/snippets/sse_streaming.conf;
        }

        # Health check passthrough
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Frontend assets + SPA routes + Vite HMR WebSocket — all proxied to
        # the Vite dev server, which serves /assets/* itself in dev mode.
        # (No local dist volume is mounted into nginx here.)
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
