# Dev nginx — HTTP only, no SSL certs required.
# Proxies /api/* → FastAPI backend, everything else → Vite dev server.
# Vite WebSocket (HMR) upgrade is passed through correctly.

worker_processes 1;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream backend  { server backend:8000;  }
    upstream frontend { server frontend:3000; }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # API — proxy directly to FastAPI
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;

            # SSE chat streaming (/messages/stream) requires unbuffered
            # passthrough — see nginx.conf for details.
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no;
        }

        # Health check passthrough
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Frontend assets + SPA routes + Vite HMR WebSocket — all proxied to
        # the Vite dev server, which serves /assets/* itself in dev mode.
        # (No local dist volume is mounted into nginx here.)
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
