<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>We'll be right back | LawHand</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #f6f7f9;
    color: #1f2933;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .card {
    max-width: 32rem;
    margin: 1.5rem;
    padding: 2.5rem 2rem;
    background: #ffffff;
    border: 1px solid #e4e7eb;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
  }
  .brand {
    margin: 0 0 1.5rem;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #0f2f56;
  }
  h1 {
    margin: 0 0 1rem;
    font-size: 1.5rem;
    font-weight: 600;
  }
  p {
    margin: 0 0 0.75rem;
    font-size: 1rem;
    line-height: 1.6;
    color: #4b5563;
  }
  p:last-child {
    margin-bottom: 0;
  }
</style>
</head>
<body>
  <main class="card">
    <p class="brand">LawHand</p>
    <h1>We'll be right back</h1>
    <p>LawHand is undergoing scheduled maintenance and will be available again in a few minutes.</p>
    <p>Your work is saved. Please retry shortly.</p>
  </main>
</body>
