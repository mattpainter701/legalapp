services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    ports: []
    environment:
      POSTGRES_USER: legalapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: legalapp
      CLARITY_APP_PASSWORD: ${CLARITY_APP_PASSWORD:?Set CLARITY_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_clarity_app_role.sh:/docker-entrypoint-initdb.d/10-clarity-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalapp -d legalapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports: []
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --save 60 1 --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  litellm-postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}
      POSTGRES_DB: litellm
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The proxy is gated by both upstream Prisma migrations and an exact,
  # reviewed schema reconciliation. Unknown drift fails before the API starts.
  litellm-migrator:
    image: legalapp-litellm:${APP_COMMIT:-dev}
    pull_policy: never
    depends_on:
      litellm-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:?Set LITELLM_DATABASE_URL in .env}
    entrypoint: ["prisma"]
    command: ["migrate", "deploy", "--schema", "/app/schema.prisma"]
    restart: "no"

  litellm-schema-migrator:
    image: legalapp-litellm:${APP_COMMIT:-dev}
    pull_policy: never
    depends_on:
      litellm-migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:?Set LITELLM_DATABASE_URL in .env}
      LITELLM_SCHEMA_REPAIR_ALLOWED: "true"
    entrypoint: ["/bin/sh"]
    command: ["/app/legalapp/reconcile_schema.sh"]
    restart: "no"

  litellm:
    build:
      context: .
      dockerfile: litellm/Dockerfile
    image: legalapp-litellm:${APP_COMMIT:-dev}
    depends_on:
      litellm-schema-migrator:
        condition: service_completed_successfully
    environment:
      LITELLM_API_KEY: ${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set the permanent LITELLM_SALT_KEY in .env}
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL:?Set LITELLM_DATABASE_URL in .env}
      DISABLE_SCHEMA_UPDATE: "true"
      STORE_MODEL_IN_DB: "True"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      OPENCODE_KEY: ${OPENCODE_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-${DEEPSEEK_API_KEY:-}}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-${OPENCODE_API_KEY:-${OPENCODE_KEY:-${DEEPSEEK_API_KEY:-}}}}
      OPENCODE_ZEN_BASE_URL: ${OPENCODE_ZEN_BASE_URL:-https://opencode.ai/zen/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 15s
      timeout: 10s
      retries: 5
      # A first boot may spend roughly three minutes initializing Prisma before
      # the HTTP listener opens. Keep cold starts inside the grace period so
      # Compose does not fail a healthy deployment prematurely.
      start_period: 240s

  migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?Set MIGRATOR_DATABASE_URL in .env}
    command: alembic upgrade head
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      APP_COMMIT: ${APP_COMMIT:-}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
      RUN_SCHEDULER: "false" # API processes never own background jobs
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      # Production invariant: override stale SMB_ENABLED=false from env_file.
      SMB_ENABLED: "true"
      WORKSPACE_MCP_ENABLED: ${WORKSPACE_MCP_ENABLED:-false}
      WORKSPACE_MCP_RESOURCE: ${WORKSPACE_MCP_RESOURCE:-}
      WORKSPACE_MCP_CANONICAL_RESOURCE: ${WORKSPACE_MCP_CANONICAL_RESOURCE:-https://mcp.getlawhand.com/api/mcp/workspace}
      WORKSPACE_MCP_RESOURCE_ALIASES: ${WORKSPACE_MCP_RESOURCE_ALIASES:-}
      RESEARCH_MCP_PUBLIC_URL: ${RESEARCH_MCP_PUBLIC_URL:-https://research.getlawhand.com/api/mcp}
      RESEARCH_MCP_OAUTH_ENABLED: ${RESEARCH_MCP_OAUTH_ENABLED:-true}
      RESEARCH_MCP_AUDIENCE: ${RESEARCH_MCP_AUDIENCE:-lawhand-research-mcp}
      RESEARCH_MCP_ISSUER: ${RESEARCH_MCP_ISSUER:-}
      RESEARCH_MCP_ACCESS_TOKEN_MAX_MINUTES: ${RESEARCH_MCP_ACCESS_TOKEN_MAX_MINUTES:-15}
      RESEARCH_MCP_AUTH_CODE_TTL_SECONDS: ${RESEARCH_MCP_AUTH_CODE_TTL_SECONDS:-300}
      RESEARCH_MCP_REFRESH_TOKEN_DAYS: ${RESEARCH_MCP_REFRESH_TOKEN_DAYS:-30}
      RESEARCH_MCP_GRANT_DAYS: ${RESEARCH_MCP_GRANT_DAYS:-90}
      RESEARCH_MCP_CLIENT_REGISTRATION_DAYS: ${RESEARCH_MCP_CLIENT_REGISTRATION_DAYS:-30}
      RESEARCH_MCP_DYNAMIC_REGISTRATION_ENABLED: ${RESEARCH_MCP_DYNAMIC_REGISTRATION_ENABLED:-true}
      WORKSPACE_MCP_AUDIENCE: ${WORKSPACE_MCP_AUDIENCE:-lawhand-workspace-mcp}
      WORKSPACE_MCP_ISSUER: ${WORKSPACE_MCP_ISSUER:-}
      WORKSPACE_MCP_TOKEN_SIGNING_KEY: ${WORKSPACE_MCP_TOKEN_SIGNING_KEY:-}
      WORKSPACE_MCP_SIGNING_PRIVATE_KEY_B64: ${WORKSPACE_MCP_SIGNING_PRIVATE_KEY_B64:-}
      WORKSPACE_MCP_SIGNING_PUBLIC_KEY_B64: ${WORKSPACE_MCP_SIGNING_PUBLIC_KEY_B64:-}
      WORKSPACE_MCP_SIGNING_KEY_ID: ${WORKSPACE_MCP_SIGNING_KEY_ID:-}
      WORKSPACE_MCP_PREVIOUS_PUBLIC_KEYS_JSON: ${WORKSPACE_MCP_PREVIOUS_PUBLIC_KEYS_JSON:-[]}
      WORKSPACE_MCP_ACCESS_TOKEN_MAX_MINUTES: ${WORKSPACE_MCP_ACCESS_TOKEN_MAX_MINUTES:-15}
      WORKSPACE_MCP_AUTH_CODE_TTL_SECONDS: ${WORKSPACE_MCP_AUTH_CODE_TTL_SECONDS:-300}
      WORKSPACE_MCP_REFRESH_TOKEN_DAYS: ${WORKSPACE_MCP_REFRESH_TOKEN_DAYS:-30}
      WORKSPACE_MCP_GRANT_DAYS: ${WORKSPACE_MCP_GRANT_DAYS:-90}
      WORKSPACE_MCP_CLIENT_REGISTRATION_DAYS: ${WORKSPACE_MCP_CLIENT_REGISTRATION_DAYS:-30}
      WORKSPACE_MCP_DYNAMIC_REGISTRATION_ENABLED: ${WORKSPACE_MCP_DYNAMIC_REGISTRATION_ENABLED:-false}
      EMAIL_ENABLED: ${EMAIL_ENABLED:?Set EMAIL_ENABLED in .env}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
      HOST_DISK_STATUS_FILE: /run/legalapp-host-status/disk-status.json
      HEALTH_HOST_DISK_MAX_AGE_SECONDS: ${HEALTH_HOST_DISK_MAX_AGE_SECONDS:-180}
      BACKUP_STATUS_FILE: ${BACKUP_STATUS_FILE:-}
      HEALTH_BACKUP_MAX_AGE_SECONDS: ${HEALTH_BACKUP_MAX_AGE_SECONDS:-7200}
      DATABASE_URL: ${APP_DATABASE_URL:?Set APP_DATABASE_URL to the clarity_app role}
      MIGRATOR_DATABASE_URL: ${MIGRATOR_DATABASE_URL:?Set MIGRATOR_DATABASE_URL in .env}
    volumes:
      - ${UPLOADS_HOST_DIR:?Set an absolute UPLOADS_HOST_DIR in .env}:/app/uploads
      - ${HOST_STATUS_HOST_DIR:?Set an absolute HOST_STATUS_HOST_DIR in .env}:/run/legalapp-host-status:ro
    # All user traffic must traverse nginx. Operator diagnostics use
    # `docker compose exec` and never publish the API directly on the host.
    ports: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-4}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Exactly one process owns APScheduler and the durable-job poller. Keeping
  # this separate prevents API restarts or future worker scaling from firing
  # customer reminders more than once.
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      APP_COMMIT: ${APP_COMMIT:-}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
      RUN_SCHEDULER: "true"
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      # Keep scheduler retrieval policy identical to the API process.
      SMB_ENABLED: "true"
      WORKSPACE_MCP_ENABLED: ${WORKSPACE_MCP_ENABLED:-false}
      WORKSPACE_MCP_RESOURCE: ${WORKSPACE_MCP_RESOURCE:-}
      WORKSPACE_MCP_CANONICAL_RESOURCE: ${WORKSPACE_MCP_CANONICAL_RESOURCE:-https://mcp.getlawhand.com/api/mcp/workspace}
      WORKSPACE_MCP_RESOURCE_ALIASES: ${WORKSPACE_MCP_RESOURCE_ALIASES:-}
      RESEARCH_MCP_PUBLIC_URL: ${RESEARCH_MCP_PUBLIC_URL:-https://research.getlawhand.com/api/mcp}
      RESEARCH_MCP_OAUTH_ENABLED: ${RESEARCH_MCP_OAUTH_ENABLED:-true}
      RESEARCH_MCP_AUDIENCE: ${RESEARCH_MCP_AUDIENCE:-lawhand-research-mcp}
      RESEARCH_MCP_ISSUER: ${RESEARCH_MCP_ISSUER:-}
      RESEARCH_MCP_ACCESS_TOKEN_MAX_MINUTES: ${RESEARCH_MCP_ACCESS_TOKEN_MAX_MINUTES:-15}
      RESEARCH_MCP_AUTH_CODE_TTL_SECONDS: ${RESEARCH_MCP_AUTH_CODE_TTL_SECONDS:-300}
      RESEARCH_MCP_REFRESH_TOKEN_DAYS: ${RESEARCH_MCP_REFRESH_TOKEN_DAYS:-30}
      RESEARCH_MCP_GRANT_DAYS: ${RESEARCH_MCP_GRANT_DAYS:-90}
      RESEARCH_MCP_CLIENT_REGISTRATION_DAYS: ${RESEARCH_MCP_CLIENT_REGISTRATION_DAYS:-30}
      RESEARCH_MCP_DYNAMIC_REGISTRATION_ENABLED: ${RESEARCH_MCP_DYNAMIC_REGISTRATION_ENABLED:-true}
      WORKSPACE_MCP_AUDIENCE: ${WORKSPACE_MCP_AUDIENCE:-lawhand-workspace-mcp}
      WORKSPACE_MCP_ISSUER: ${WORKSPACE_MCP_ISSUER:-}
      WORKSPACE_MCP_TOKEN_SIGNING_KEY: ${WORKSPACE_MCP_TOKEN_SIGNING_KEY:-}
      WORKSPACE_MCP_SIGNING_PRIVATE_KEY_B64: ${WORKSPACE_MCP_SIGNING_PRIVATE_KEY_B64:-}
      WORKSPACE_MCP_SIGNING_PUBLIC_KEY_B64: ${WORKSPACE_MCP_SIGNING_PUBLIC_KEY_B64:-}
      WORKSPACE_MCP_SIGNING_KEY_ID: ${WORKSPACE_MCP_SIGNING_KEY_ID:-}
      WORKSPACE_MCP_PREVIOUS_PUBLIC_KEYS_JSON: ${WORKSPACE_MCP_PREVIOUS_PUBLIC_KEYS_JSON:-[]}
      WORKSPACE_MCP_ACCESS_TOKEN_MAX_MINUTES: ${WORKSPACE_MCP_ACCESS_TOKEN_MAX_MINUTES:-15}
      WORKSPACE_MCP_AUTH_CODE_TTL_SECONDS: ${WORKSPACE_MCP_AUTH_CODE_TTL_SECONDS:-300}
      WORKSPACE_MCP_REFRESH_TOKEN_DAYS: ${WORKSPACE_MCP_REFRESH_TOKEN_DAYS:-30}
      WORKSPACE_MCP_GRANT_DAYS: ${WORKSPACE_MCP_GRANT_DAYS:-90}
      WORKSPACE_MCP_CLIENT_REGISTRATION_DAYS: ${WORKSPACE_MCP_CLIENT_REGISTRATION_DAYS:-30}
      WORKSPACE_MCP_DYNAMIC_REGISTRATION_ENABLED: ${WORKSPACE_MCP_DYNAMIC_REGISTRATION_ENABLED:-false}
      EMAIL_ENABLED: ${EMAIL_ENABLED:?Set EMAIL_ENABLED in .env}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
      DATABASE_URL: ${APP_DATABASE_URL:?Set APP_DATABASE_URL to the clarity_app role}
      MIGRATOR_DATABASE_URL: ${MIGRATOR_DATABASE_URL:?Set MIGRATOR_DATABASE_URL in .env}
    volumes:
      - ${UPLOADS_HOST_DIR:?Set an absolute UPLOADS_HOST_DIR in .env}:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:?Set VITE_PUBLIC_SITE_URL to https://DOMAIN in .env}
        VITE_CONTACT_URL: ${VITE_CONTACT_URL:?Set VITE_CONTACT_URL in .env}
        VITE_PUBLIC_SIGNUP_ENABLED: ${VITE_PUBLIC_SIGNUP_ENABLED:-false}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_GOOGLE_SITE_VERIFICATION: ${VITE_GOOGLE_SITE_VERIFICATION:-}
        VITE_ORG_SAME_AS: ${VITE_ORG_SAME_AS:-}
        VITE_ORG_TELEPHONE: ${VITE_ORG_TELEPHONE:-}
        VITE_ENABLE_AFTER_CALL_ASSISTANT: ${VITE_ENABLE_AFTER_CALL_ASSISTANT:-false}
    depends_on:
      backend:
        condition: service_healthy
    # Prevent bypassing nginx security headers, TLS, and request limits.
    ports: []
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  office-addin:
    build:
      context: .
      dockerfile: office-addin/Dockerfile
      args:
        OFFICE_ADDIN_ORIGIN: https://${DOMAIN}
        VITE_API_BASE: /api
        VITE_OFFICE_ENTRA_CLIENT_ID: ${OFFICE_ENTRA_CLIENT_ID:-}
        VITE_OFFICE_ENTRA_AUTHORITY: ${OFFICE_ENTRA_AUTHORITY:-https://login.microsoftonline.com/common}
        VITE_OFFICE_API_SCOPE: ${OFFICE_ENTRA_API_AUDIENCE:-}/office.access
    # The task pane is reachable only through nginx at /office/.
    ports: []
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.local
    depends_on:
      frontend:
        condition: service_healthy
      office-addin:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/webroot:/var/www/certbot:ro
    # cloudflared runs on the VM and reaches this loopback-only origin. Keep
    # the origin unreachable from the public network; the Tunnel is the sole
    # ingress path and verifies nginx with the pinned private CA.
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  litellm_postgres_data:
