# Dev overrides — applied automatically by docker compose on top of docker-compose.yml
# Hot-reload backend + frontend, expose DB/Redis for local tooling

services:
  backend:
    volumes:
      - ./backend:/app          # live code mount for --reload
      - ./uploads:/app/uploads
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug"

  frontend:
    volumes:
      - ./frontend/src:/app/src          # HMR for React
      - ./frontend/public:/app/public
    environment:
      - VITE_API_URL=/api               # relative — handled by Vite proxy to backend:8000

  postgres:
    ports:
      - "5432:5432"    # expose for pgAdmin / DBeaver locally

  redis:
    ports:
      - "6379:6379"    # expose for redis-cli locally

  nginx:
    # Dev: HTTP only, no SSL certs needed.
    # Mounts nginx.dev.conf over the prod config baked into the image at build time.
    # The ./nginx/ssl volume from base compose still mounts (as an empty dir) — harmless.
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
