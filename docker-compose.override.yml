# Dev overrides — applied automatically by docker compose on top of docker-compose.yml
# Hot-reload backend + frontend, expose DB/Redis for local tooling

services:
  backend:
    volumes:
      - ./backend:/app          # live code mount for --reload
      - ./uploads:/app/uploads
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug"

  frontend:
    volumes:
      - ./frontend/src:/app/src          # HMR for React
      - ./frontend/public:/app/public
    environment:
      - VITE_API_URL=/api               # relative — handled by Vite proxy to backend:8000

  postgres:
    image: pgvector/pgvector:pg16    # vector extension required for migration 006
    ports:
      - "5434:5432"    # expose for pgAdmin / DBeaver locally (5432 may be taken on hypervisor)

  # Dedicated vectorDB for CourtListener public_chunks (BGE-384 embeddings).
  # Populated by scripts/ingest_courtlistener.py and scripts/jetson_embed_worker.py.
  # Set VECTORDB_URL=postgresql://vectordb:vectordb@localhost:5433/vectordb in .env
  # to point the ingest script at this instance instead of the main DB.
  vectordb:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vectordb
      POSTGRES_PASSWORD: vectordb
      POSTGRES_DB: vectordb
    ports:
      - "5433:5432"
    volumes:
      - vectordb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectordb -d vectordb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    ports:
      - "6380:6379"    # expose for redis-cli locally (6379 may be taken on hypervisor)

  nginx:
    # Dev: HTTP only, no SSL certs needed.
    # Mounts nginx.dev.conf over the prod config baked into the image at build time.
    # The ./nginx/ssl volume from base compose still mounts (as an empty dir) — harmless.
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"

volumes:
  vectordb_data:
